<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;500&family=Assistant:wght@300;400;600&display=swap">
<style>
/* Layout: a phone-width column. The week is a staff of notes, Shabbat is a rest. Colour and type tokens: the calm block below. */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:8px 110px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:4px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:10px}
.brand{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.hdate{color:var(--muted);font-size:.88rem}
.theme-chip{display:inline-block;color:var(--pen);font-size:.85rem;margin-top:2px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--muted);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:10px}
.card.accent{border-color:var(--pen);background:var(--pen-soft)}
.eyebrow{font-size:.78rem;letter-spacing:.06em;font-weight:600;color:var(--pen)}
.label{font-size:.8rem;font-weight:600;color:var(--muted)}
.insight-title{font-size:2rem}
.src{font-family:var(--display);color:var(--pen);font-size:1rem}
.action{border-inline-start:3px solid var(--pen);padding-inline-start:14px;display:grid;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:4px;padding:9px 20px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.btn.done{background:none;color:var(--good);border-color:var(--good)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--pen);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* the day's text with the Tanya source as a margin note */
.daf{display:grid;grid-template-columns:minmax(0,1fr) 5.6rem;gap:14px}
.daf .main{display:grid;gap:8px;min-width:0}
.margin{border-inline-start:1px solid var(--staff);padding-inline-start:10px;font-size:.8rem;line-height:1.5;color:var(--muted);display:grid;gap:12px;align-content:start}
.margin b{display:block;color:var(--pen);font-weight:600;font-size:.75rem;letter-spacing:.04em}

/* staff (SVG) */
.staff-card{display:grid;gap:4px;padding-block:4px}
.stf{display:block;overflow:visible}
.stf line{stroke:var(--staff);stroke-width:1}
.stf text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.stf .t-pen{fill:var(--pen);font-weight:700}
.stf .n-ink{fill:var(--ink)}
.stf .n-pen{fill:var(--pen)}
.stf .n-hol{fill:none;stroke:var(--muted);stroke-width:1.3}
.stf .n-win{fill:var(--good)}
.stf .n-auto{fill:none;stroke:var(--auto);stroke-width:1.6}
.stf .fut{opacity:.4}
.stf line.stem-ink{stroke:var(--ink);stroke-width:1.4}
.stf line.stem-pen{stroke:var(--pen);stroke-width:1.7}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.kn{width:11px;height:8px;border-radius:50%;transform:rotate(-20deg);display:inline-block}
.kn.ink{background:var(--ink)} .kn.pen{background:var(--pen)} .kn.win{background:var(--good)} .kn.auto{border:1.6px solid var(--auto)} .kn.hol{border:1.3px solid var(--muted)}

.level{display:grid;gap:6px}
.lvl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl-name{font-family:var(--display);font-size:1.5rem}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pen);border-radius:3px}
.steps{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.steps b{color:var(--pen)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:4px;padding:6px 14px;cursor:pointer;background:var(--surface);font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:600}
textarea,input[type=text]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;min-height:44px}
textarea:focus,input[type=text]:focus{border-color:var(--pen);outline:none}
.q{font-family:var(--display);font-size:1.35rem;line-height:1.25}

.big{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.wins{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:5em minmax(0,1fr) 2.2em;gap:8px;align-items:center;font-size:.9rem}
.hb .track{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;display:flex}
.hb .track i{display:block;height:100%}
.hb .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.demo-banner{background:var(--auto);color:var(--bg);border-radius:4px;padding:6px 12px;font-size:.85rem;font-weight:600}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--staff);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:5}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;align-items:end;gap:4px}
.tab{background:none;border:none;cursor:pointer;padding:6px 2px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:.8rem}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--pen);font-weight:600}
.moment-btn{justify-self:center;background:var(--pen);color:var(--on-pen);border:none;border-radius:999px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:.9rem;transform:translateY(-10px);white-space:nowrap}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.ov-in{max-width:480px;margin:0 auto;display:grid;gap:18px}
.close{justify-self:start;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:4px 0}
.ferm{width:200px;max-width:100%;display:block;margin:12px auto 0;transform-origin:center bottom}
.ferm .arc{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:round}
.ferm .dotp{fill:var(--pen)}
.ferm line{stroke:var(--staff)}
@media (prefers-reduced-motion:no-preference){.ferm.in{animation:hold 4s ease-in-out forwards}.ferm.out{animation:release 4s ease-in-out forwards}}
@keyframes hold{from{transform:scaleX(.75)}to{transform:scaleX(1.08)}}
@keyframes release{from{transform:scaleX(1.08)}to{transform:scaleX(.75)}}
.breath-word{font-family:var(--display);font-size:2.3rem;text-align:center}
.center{text-align:center}
.help{border-color:var(--warn)}
.help .eyebrow{color:var(--warn)}
.phone{font-family:var(--display);font-size:1.4rem;direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;inset:auto 0 calc(96px + env(safe-area-inset-bottom, 0px)) 0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--bg);border-radius:4px;padding:8px 18px;font-weight:600;font-size:.92rem}
.opt{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:12px 16px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--pen)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--pen)}
.foot{font-size:.8rem;color:var(--muted);text-align:center;display:grid;gap:4px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.hero-title{font-size:2.5rem}

/* ===== Calm version: "an island of sanity in the race of life" =====
   Still water at dawn: misty sage ground, deep slate ink, one warm candle-gold accent (נר ה׳ נשמת אדם).
   No boxes, no counters, wide air, slow light motion. */
:root{
  --bg:#EDF1EE; --surface:#F4F7F5; --sunk:#E1E8E3; --ink:#22302C; --muted:#64726D; --line:#D3DCD6;
  --staff:#C3CEC7; --pen:#A06B1C; --pen-soft:rgba(196,140,52,.13); --on-pen:#FFFFFF; --good:#4E7D62; --auto:#8C6A84; --warn:#A33A2C;
  --display:"Noto Serif Hebrew","Frank Ruhl Libre",Georgia,serif;
  --body:"Assistant","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(214,160,72,.16), transparent 70%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#16201D; --sunk:#1D2925; --ink:#E3EAE6; --muted:#97A59F; --line:#26332F;
  --staff:#33423D; --pen:#E2B15C; --pen-soft:rgba(226,177,92,.12); --on-pen:#1A1408; --good:#7DBB96; --auto:#C3A0BC; --warn:#F08A7C;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(226,177,92,.10), transparent 70%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#16201D; --sunk:#1D2925; --ink:#E3EAE6; --muted:#97A59F; --line:#26332F;
  --staff:#33423D; --pen:#E2B15C; --pen-soft:rgba(226,177,92,.12); --on-pen:#1A1408; --good:#7DBB96; --auto:#C3A0BC; --warn:#F08A7C;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(226,177,92,.10), transparent 70%); color-scheme:dark}

body{font-size:17.5px;line-height:1.85;font-weight:400;background:var(--bg)}
.app{gap:44px;max-width:440px;padding-block:16px 140px}
h1,h2,h3{font-weight:400;letter-spacing:-.005em}
.brand{font-size:1.25rem;font-weight:400;color:var(--muted)}
.theme-chip{color:var(--muted)}
.iconbtn{border:none;color:var(--muted);padding:4px 6px;font-size:.88rem}
/* no boxes: sections are separated by air and a short hairline */
.card{background:none;border:none;border-radius:0;padding:0;gap:14px}
.card + .card::before{content:"";display:block;width:36px;height:1px;background:var(--line);margin:0 auto 28px}
.card.accent{background:var(--glow);border:none;border-radius:24px;padding:28px 20px}
.card + .card.accent::before{display:none}
.eyebrow{font-weight:400;letter-spacing:.08em;color:var(--pen);font-size:.82rem}
.label{font-weight:400;color:var(--muted)}
.insight-title{font-size:2.3rem;line-height:1.2}
.q{font-size:1.45rem;line-height:1.45}
.action{border-inline-start:none;padding:0;gap:14px}
.btn{border-radius:999px;background:var(--pen);border-color:var(--pen);color:var(--on-pen);font-weight:400;padding:10px 26px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.done{background:none}
.chip{border-radius:999px;background:none;border-color:var(--line)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:400}
textarea,input[type=text]{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px}
.opt{background:none;border-radius:16px}
.margin{border-inline-start-color:var(--line)}
.margin b{font-weight:400;color:var(--pen)}
.nav{background:var(--bg);border-top:none}
.tab[aria-current="page"]{font-weight:400}
.moment-btn{background:none;color:var(--pen);border:1px solid var(--pen);font-weight:400;transform:translateY(-6px)}
.toast span{border-radius:999px;font-weight:400}
.foot{opacity:.8}
.stf .n-ink{fill:var(--muted)}
.stf line.stem-ink{stroke:var(--muted)}
.quiet-win{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font-size:.95rem;text-decoration:underline;text-underline-offset:4px}
.dots5{display:flex;gap:10px;align-items:center;justify-content:center}
.dots5 i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots5 i.on{background:var(--pen);width:9px;height:9px}
/* logo: the note and the flame */
.mark{display:inline-block;vertical-align:-.2em;width:1.05em;height:1.22em;margin-inline-end:.35em}
.mark .fl{fill:var(--pen)} .mark .nt{fill:var(--ink)} .mark .st{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.mark.big{display:block;width:56px;height:66px;margin:0 0 6px}
.demo-banner{background:none;color:var(--muted);border:1px dashed var(--line);border-radius:999px;font-weight:400;text-align:center;padding:4px 14px}
textarea{resize:none}
.team summary{cursor:pointer;color:var(--muted);font-size:.9rem;list-style:none}
.team summary::-webkit-details-marker{display:none}
.team[open] summary{margin-bottom:14px}
/* slow light: sections settle in, from an almost-visible resting state */
@media (prefers-reduced-motion:no-preference){
  #app > *{animation:settle 1.4s ease-out both}
  #app > *:nth-child(2){animation-delay:.15s} #app > *:nth-child(3){animation-delay:.3s} #app > *:nth-child(4){animation-delay:.45s}
}
@keyframes settle{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
/* the threshold: a short pause before entering */
.threshold{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center;cursor:pointer;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s ease}
.threshold.gone{opacity:0;pointer-events:none}
.threshold .orb{width:120px;height:120px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle,var(--pen-soft),transparent 70%);border:1px solid var(--pen)}
@media (prefers-reduced-motion:no-preference){.threshold .orb{animation:orb 4s ease-in-out infinite}}
@keyframes orb{0%,100%{transform:scale(.8)}50%{transform:scale(1.05)}}
.threshold p{font-family:var(--display);font-size:1.7rem;line-height:1.4}
.threshold small{display:block;margin-top:14px;color:var(--muted);font-size:.85rem}
</style>

<div class="app" id="app" dir="rtl" lang="he"><div class="loading">טוען…</div></div>
<nav class="nav" id="nav" hidden aria-label="ניווט" dir="rtl" lang="he">
  <div class="nav-in">
    <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>היום</button>
    <button class="tab" data-tab="debrief" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>התבוננות</button>
    <button class="moment-btn" data-act="moment" type="button">אני באוטומט</button>
    <button class="tab" data-tab="map" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6h20M2 10h20M2 14h20M2 18h20"/><ellipse cx="9" cy="16" rx="2.6" ry="2" fill="currentColor"/></svg>המפה</button>
  </div>
</nav>
<div id="overlay" dir="rtl" lang="he"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="threshold" id="threshold" dir="rtl" lang="he" role="button" tabindex="0" aria-label="כניסה">
  <div><div class="orb"></div><p>עצור רגע.<br>נשימה אחת, ואז נכנסים.</p><small>נגיעה כדי להיכנס</small></div>
</div>
<script>
(function(){
  const t = document.getElementById("threshold"); let done = false;
  const enter = () => { if(done) return; done = true; t.classList.add("gone"); setTimeout(() => t.remove(), 1300); };
  t.addEventListener("click", enter); t.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") enter(); });
  setTimeout(enter, 4200);
})();
</script>

<script>
(function(){
/* ---------- content (original wording; the Tanya first, other sources cited by name) ---------- */
const POWERS = [
 {key:"thought", name:"מחשבה", items:[
  {t:"מחשבה היא לא אתה", x:"לפי התניא, גם אצל הבינוני עולות מחשבות שהוא לא בחר בהן. ההבדל הוא לא במה שעולה, אלא במה שאתה עושה עם זה: לא להתווכח עם המחשבה ולא להתעסק בה, אלא להסיט ממנה את תשומת הלב.", s:"תניא, פרק י״ב", a:"כשעולה היום מחשבה מטרידה, תן לה שם (״זה האוטומט״) ועבור לדבר אחר תוך עשר שניות."},
  {t:"המחשבה היא לבוש", x:"התניא מתאר שלושה לבושים שדרכם הנפש יוצאת לעולם: מחשבה, דיבור ומעשה. המחשבה היא הלבוש הפנימי ביותר, והיא תמיד איתך. מי שמנהל את המחשבה מתחיל לנהל את כל השאר.", s:"תניא, פרק ד׳", a:"בחר מחשבה אחת שתחזור אליה היום בכל פעם שאתה מחכה: בתור, ברמזור, מול הטלפון."}]},
 {key:"speech", name:"דיבור", items:[
  {t:"מה יוצא מהפה", x:"הבינוני, לפי התניא, אולי לא שולט במה שעולה בלב, אבל הוא שולט במה שיוצא מהפה. בין הרגש לבין המילה יש רגע של בחירה.", s:"תניא, פרק י״ב", a:"לפני משפט אחד שעומד לצאת בכעס או בעלבון, עצור לנשימה אחת. אם צריך, אל תגיד אותו."},
  {t:"מילה יוצאת לעולם", x:"הדיבור הוא לבוש גלוי יותר מהמחשבה. מה שנאמר כבר יוצא לעולם ומשפיע על אחרים. לכן דיבור טוב אחד שווה הרבה כוונות טובות.", s:"תניא, פרק ד׳", a:"אמור היום משפט אחד של הכרת תודה לאדם שבדרך כלל לא שומע ממך כזה."}]},

/* Hebrew numerals: 14 -> י״ד, 5787 -> תשפ״ז */
function gematria(n){
  n = n % 1000; let s = "";
  const H = ["","ק","ר","ש","ת"], T = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"], U = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
  while(n >= 400){ s += "ת"; n -= 400; }
  if(n >= 100){ s += H[Math.floor(n/100)]; n %= 100; }
  if(n === 15){ s += "טו"; n = 0; } else if(n === 16){ s += "טז"; n = 0; }
  if(n >= 10){ s += T[Math.floor(n/10)]; n %= 10; }
  s += U[n];
  return s.length === 1 ? s + "׳" : s.slice(0,-1) + "״" + s.slice(-1);
}
function hebDate(d){
  try{
    const parts = new Intl.DateTimeFormat("he-u-ca-hebrew-nu-latn",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d);
    const get = k => (parts.find(x => x.type===k)||{}).value || "";
    const day = parseInt(get("day"),10), year = parseInt(get("year"),10), month = get("month");
    if(!day || !year || !month) throw 0;
    return `${gematria(day)} ב${month.replace(/^ב/,"")} ${gematria(year)}`;
  }catch(e){ try{ return new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).format(d); }catch(e2){ return ""; } }
}

function hebMonth(d){ try{ return new Intl.DateTimeFormat("he-u-ca-hebrew",{month:"long"}).format(d); }catch(e){ return ""; } }
function monthTheme(d){

  for(const [k,t] of MONTHS){ if(k==="אב" ? (m.trim()==="אב" || m.trim()==="מנחם אב") : m.includes(k)) return {m, t}; }
  return {m, t:null};
}
function weekNum(d){ const a = new Date(d.getFullYear(),0,1); return Math.floor((d - a)/(7*864e5)); }
function weekStart(d){ const s = new Date(d); s.setHours(0,0,0,0); s.setDate(s.getDate()-s.getDay()); return s; }

/* ---------- storage: private per-viewer db, falling back to this device ---------- */
const store = { mode:"memory", db:null, uid:null, mem:{profile:null, days:{}} };
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function withTimeout(p, ms){ return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
async function initStore(){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const [db, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 6000) || [];
      const uid = user ? await withTimeout(user.id(), 3000) : null;
      if(db && uid){ store.db = db; store.uid = uid; store.user = user; store.mode = "cloud"; return; }
    }
  }catch(e){}
  try{ localStorage.setItem("mh-probe","1"); localStorage.removeItem("mh-probe"); store.mode = "local"; }catch(e){ store.mode = "memory"; }
}
const profRef = () => store.db.doc("data/users/"+store.uid+"/profile");
const daysCol = () => profRef().collection("days");
async function fallback(){ store.mode = "local"; try{ localStorage.setItem("mh-probe","1"); }catch(e){ store.mode = "memory"; } }
async function loadProfile(){
  if(store.mode==="cloud"){ try{ const s = await profRef().get(); return s.exists ? {...s.data()} : null; }catch(e){ await fallback(); } }
  if(store.mode==="local") return lsGet("mh-profile");
  return store.mem.profile;
}
async function saveProfile(p){
  if(store.mode==="cloud"){ try{ await profRef().set(p); return; }catch(e){ await fallback(); } }
  if(store.mode==="local"){ lsSet("mh-profile", p); return; }
  store.mem.profile = p;
}
async function loadDays(){
  if(store.mode==="cloud"){
    try{ const snap = await daysCol().orderBy("date","desc").limit(400).get(); const out = {}; snap.docs.forEach(d => { out[d.id] = JSON.parse(JSON.stringify(d.data())); }); return out; }
    catch(e){ await fallback(); }
  }
  if(store.mode==="local") return lsGet("mh-days") || {};
  return store.mem.days;
}
async function saveDay(key, day){
  if(store.mode==="cloud"){ try{ await daysCol().doc(key).set(day); return; }catch(e){ await fallback(); } }
  if(store.mode==="local"){ const all = lsGet("mh-days") || {}; all[key] = day; lsSet("mh-days", all); return; }
  store.mem.days[key] = day;
}

    if(!S.profile.shareWithGuide){ await ref.set({optIn:false, updatedAt:new Date().toISOString()}); return; }
    const w = weekStats(S.days, realNow()), L = level(), garments = {};

}
async function loadNotes(){
  S.notes = []; S.names = {};

/* ---------- the score: SVG helpers ---------- */
function staffLines(x1, x2, ys){ return ys.map(y => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`).join(""); }
function note(cls, x, y, rx, ry){ return `<ellipse class="${cls}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-20 ${x} ${y})"/>`; }
/* The week as one staff: Sunday at the right. Pitch rises with the day's work; today is in the conductor's blue; Shabbat is a rest. */
function weekStaff(){
  const d = now(), ws = weekStart(d), all = days(), tk = keyOf(d);
  let s = `<svg class="stf" viewBox="0 -8 300 92" width="100%" role="img" aria-label="השבוע כשורת תווים">` + staffLines(0, 300, [14,24,34,44,54]);
  for(let i=0;i<7;i++){
    const x = 276 - i*42, xd = new Date(ws); xd.setDate(ws.getDate()+i);
    const k = keyOf(xd), day = all[k] || {}, isT = k===tk, fut = !isT && xd > d;
    const act = (day.done?1:0) + (day.moments||[]).filter(m => m.result==="win").length + (day.debrief?1:0);
    if(i===6){ s += `<rect class="${isT?"n-pen":"n-ink"}" x="${x-7}" y="24" width="14" height="5"/>`; }
    else {
      const y = fut ? 44 : 49 - Math.min(act,4)*5, rx = isT?8.5:7, ry = isT?6:5;
      s += note((isT?"n-pen":(act?"n-ink":"n-hol")) + (fut?" fut":""), x, y, rx, ry);
      if(act || isT) s += `<line class="${isT?"stem-pen":"stem-ink"}" x1="${x+rx-1}" y1="${y-1}" x2="${x+rx-1}" y2="${y-30}"/>`;
    }
    s += `<text x="${x}" y="78" text-anchor="middle" class="${isT?"t-pen":""}">${DAY_SHORT[i]}</text>`;
  }
  return s + `</svg>`;
}

function arenaScore(grid, d){
  const ys = [12,28,44,60,76], tk = keyOf(d);
  let s = `<svg class="stf" viewBox="0 0 300 104" width="100%" role="img" aria-label="התווים של השבוע לפי זירות">` + staffLines(8, 252, ys);
  ARENAS.forEach(([k],j) => { s += `<text x="276" y="${ys[j]+4}" text-anchor="middle">${ARENA_SHORT[k]}</text>`; });
  grid.forEach((col,i) => {
    const x = 232 - i*34;
    if(i===6){ s += `<rect class="n-ink" x="${x-6}" y="${ys[2]-6}" width="12" height="5"/>`; }
    else ARENAS.forEach(([k],j) => { const c = col.arenas[k]; const y = ys[j];
      if(c.win && c.auto){ s += note("n-win", x-6, y, 5.5, 4) + note("n-auto", x+6, y, 5.5, 4); }
      else if(c.win){ s += note("n-win", x, y, 6, 4.3); }
      else if(c.auto){ s += note("n-auto", x, y, 6, 4.3); } });
    s += `<text x="${x}" y="98" text-anchor="middle" class="${col.key===tk?"t-pen":""}">${DAY_SHORT[i]}</text>`;
  });
  return s + `</svg>`;

function weekStats(all, d){
  const ws = weekStart(d), week = []; for(let i=0;i<7;i++){ const x = new Date(ws); x.setDate(ws.getDate()+i); week.push(x); }
  let wins=0, autos=0, done=0, workDays=0; const chW = {}, chA = {}, winArenas = new Set();
  CHANNELS.forEach(([k]) => { chW[k] = 0; chA[k] = 0; });
  const grid = week.map(x => { const col = {key:keyOf(x), arenas:{}}; ARENAS.forEach(([k]) => col.arenas[k] = {win:0, auto:0}); return col; });
  const addWin = (A, arena, ch) => { wins++; if(arena){ A[arena].win++; winArenas.add(arena); } if(ch) chW[ch]++; };
  const addAuto = (A, arena, ch) => { autos++; if(arena) A[arena].auto++; if(ch) chA[ch]++; };
  week.forEach((x,i) => { const day = all[keyOf(x)]; if(!day) return; const A = grid[i].arenas; if(day.done) done++;
    if(day.done || (day.moments||[]).length || day.debrief) workDays++;
    (day.moments||[]).forEach(m => m.result==="win" ? addWin(A, m.arena, m.channel) : addAuto(A, m.arena, m.channel));
    const b = day.debrief; if(!b) return;
    if(b.g){ CHANNELS.forEach(([c]) => { const o = b.g[c]; if(!o || !o.result) return; o.result==="win" ? addWin(A, o.arena, c) : addAuto(A, o.arena, c); }); }
    else { if(b.autoText||b.autoArena) addAuto(A, b.autoArena, b.autoChannel); if(b.winText||b.winArena) addWin(A, b.winArena, null); } });
  return {wins, autos, done, workDays, chW, chA, grid, winArenas};
}

function makeDemo(){
  const out = {}, d = now(), ws = weekStart(d), ar = ARENAS.map(a=>a[0]), ch = CHANNELS.map(c=>c[0]);
  let seed = 7; const rnd = n => { seed = (seed*9301+49297)%233280; return Math.floor(seed/233280*n); };
  for(let i=0;i<=Math.min(5, d.getDay()===6?5:d.getDay());i++){
    const x = new Date(ws); x.setDate(ws.getDate()+i); const k = keyOf(x);
    const moments = []; for(let j=0;j<2+rnd(3);j++) moments.push({result: rnd(3)?"win":"auto", arena: ar[rnd(5)], channel: ch[rnd(3)]});
    const sample = {thought:"תפסתי את עצמי מתעסק בטינה, ועברתי לדבר אחר", speech:"עצרתי לפני שעניתי בחוסר סבלנות", action:"סידרתי משהו שדחיתי שבוע"};
    const g = {}; ch.forEach(c => { g[c] = rnd(3) ? {text: sample[c], result: rnd(3)?"win":"auto", arena: ar[rnd(5)]} : {text:"", result:null, arena:null}; });
    out[k] = {date:k, done: rnd(4)>0, moments, debrief: rnd(3)?{lvl:1, g, tomorrow:"נשימה אחת לפני שאני עונה"}:null};
  }
  for(let i=1;i<=40;i++){ const x = new Date(ws); x.setDate(ws.getDate()-i); if(x.getDay()===6) continue; const k = keyOf(x); out[k] = {date:k, done:true, moments:[], debrief:null}; }
  return out;
}

  if(t.dataset.mchip){ const f = t.dataset.mchip; M[f] = (f!=="result" && M[f]===t.dataset.k) ? null : t.dataset.k; drawMoment(); return; }
  const a = t.dataset.act; if(!a) return;

  else if(a==="quick-win"){ const day = today(); day.moments = [...(day.moments||[]), {result:"win", at:new Date().toISOString()}]; await putToday(day); render(); toast("ניצחון נרשם."); }
  else if(a==="save-debrief"){ const texts = [...CHANNELS.map(([c]) => D.g[c].text), D.tomorrow, (D.guideQ && D.guideQ.text) || ""]; const day = today(); day.debrief = {...D, at:new Date().toISOString()}; D = null; await putToday(day); render(); window.scrollTo(0,0);
    if(isDistress(texts)) openHelp("נשמע שעובר עליך משהו כבד. מגיע לך שמישהו יקשיב עכשיו."); else toast("ראית, למדת, ממשיכים."); }
  else if(a==="edit-debrief"){ const b = today().debrief; D = b.g ? JSON.parse(JSON.stringify(b)) : {...blankDraft(), tomorrow: b.tomorrow||""}; render(); }
  else if(a==="moment"){ openMoment(); }
  else if(a==="m-next"){ clearTimeout(breathT); M.step++; drawMoment(); }
  else if(a==="m-save"){ const day = today(); day.moments = [...(day.moments||[]), {result:M.result, arena:M.arena, channel:M.channel, at:new Date().toISOString()}]; await putToday(day); M.step = 3; drawMoment(); render(); }
  else if(a==="close"){ M = null; closeOv(); }
  else if(a==="help"){ openHelp(""); }
  else if(a==="settings"){ openSettings(); }
  else if(a==="pick-day"){ const want = Number(t.dataset.d), cur = realNow().getDay(); demoOffset = want - cur; closeOv(); render(); }
  else if(a==="real-day"){ demoOffset = 0; render(); }
  else if(a==="preview-level"){ openLevelUp(Number(t.dataset.i), true); }
  else if(a==="edit-mission"){ ov.innerHTML = `<div class="overlay"><div class="ov-in"><button class="close" data-act="close" type="button">סגירה</button>${missionCard(false)}</div></div>`; }
  else if(a==="toggle-share"){ S.profile.shareWithGuide = !S.profile.shareWithGuide; await saveProfile(S.profile); await syncShare(); openSettings(); toast(S.profile.shareWithGuide ? "הסיכום השבועי משותף עם המלווה." : "השיתוף הופסק."); }
  else if(a==="guide"){ openGuide(); }
  else if(a==="guide-send"){ const i = Number(t.dataset.i), p = (S.guidePeople||[])[i], ta = document.getElementById("gt-"+i), text = ((ta && ta.value) || "").trim();
    if(!p) return; if(!text){ toast("כתוב קודם משפט קצר."); return; }
    try{ await store.db.collection("shares/"+p.id+"/notes").doc("n"+Date.now()).set({kind:t.dataset.k, text, at:new Date().toISOString(), by:store.uid}); toast("נשלח."); openGuide(); }
    catch(e){ toast("השליחה לא הצליחה. נסה שוב."); } }
  else if(a==="save-mission"){ const v = (document.getElementById("mission").value || "").trim(); S.profile.mission = v; await saveProfile(S.profile); closeOv(); render(); toast(v ? "השליחות נשמרה." : "השליחות נמחקה."); }
  else if(a==="demo-on"){ S.demo = makeDemo(); closeOv(); S.tab = "map"; render(); }
  else if(a==="demo-off"){ S.demo = null; closeOv(); render(); }
  else if(a==="redo-quiz"){ closeOv(); S.ob = {step:2, quiz:[], agreed:true}; S.profile = null; render(); }
});

/* ---------- boot ---------- */
(async function boot(){
  await initStore();
  S.profile = await loadProfile();
  S.days = await loadDays() || {};
  await loadNotes();
  if(store.user){ try{ S.isGuide = await store.user.canEdit(); }catch(e){ S.isGuide = false; } }
  if(S.profile && S.profile.lastActive){ const gap = (Date.now() - Date.parse(S.profile.lastActive)) / 864e5; S.welcomeBack = gap > 3; }
  render();
})();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
