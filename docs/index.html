<head>

<title>מנגינת החיים</title>
<meta name="description" content="עבודה פנימית יומית לפי מודל הנפש של ספר התניא">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;500&family=Assistant:wght@300;400;600&display=swap">
<style>
/* Layout: a phone-width column. The week is a staff of notes, Shabbat is a rest. Colour and type tokens: the calm block below. */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:480px;margin:0 auto;padding-block:8px 110px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:4px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:10px}
.brand{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.hdate{color:var(--muted);font-size:.88rem}
.theme-chip{display:inline-block;color:var(--pen);font-size:.85rem;margin-top:2px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--muted);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:10px}
.card.accent{border-color:var(--pen);background:var(--pen-soft)}
.eyebrow{font-size:.78rem;letter-spacing:.06em;font-weight:600;color:var(--pen)}
.label{font-size:.8rem;font-weight:600;color:var(--muted)}
.insight-title{font-size:2rem}
.src{font-family:var(--display);color:var(--pen);font-size:1rem}
.action{border-inline-start:3px solid var(--pen);padding-inline-start:14px;display:grid;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:4px;padding:9px 20px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.btn.done{background:none;color:var(--good);border-color:var(--good)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:none;color:var(--pen);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* the day's text with the Tanya source as a margin note */
.daf{display:grid;grid-template-columns:minmax(0,1fr) 5.6rem;gap:14px}
.daf .main{display:grid;gap:8px;min-width:0}
.margin{border-inline-start:1px solid var(--staff);padding-inline-start:10px;font-size:.8rem;line-height:1.5;color:var(--muted);display:grid;gap:12px;align-content:start}
.margin b{display:block;color:var(--pen);font-weight:600;font-size:.75rem;letter-spacing:.04em}

/* staff (SVG) */
.staff-card{display:grid;gap:4px;padding-block:4px}
.stf{display:block;overflow:visible}
.stf line{stroke:var(--staff);stroke-width:1}
.stf text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.stf .t-pen{fill:var(--pen);font-weight:700}
.stf .n-ink{fill:var(--ink)}
.stf .n-pen{fill:var(--pen)}
.stf .n-hol{fill:none;stroke:var(--muted);stroke-width:1.3}
.stf .n-win{fill:var(--good)}
.stf .n-auto{fill:none;stroke:var(--auto);stroke-width:1.6}
.stf .fut{opacity:.4}
.stf line.stem-ink{stroke:var(--ink);stroke-width:1.4}
.stf line.stem-pen{stroke:var(--pen);stroke-width:1.7}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.kn{width:11px;height:8px;border-radius:50%;transform:rotate(-20deg);display:inline-block}
.kn.ink{background:var(--ink)} .kn.pen{background:var(--pen)} .kn.win{background:var(--good)} .kn.auto{border:1.6px solid var(--auto)} .kn.hol{border:1.3px solid var(--muted)}

.level{display:grid;gap:6px}
.lvl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl-name{font-family:var(--display);font-size:1.5rem}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pen);border-radius:3px}
.steps{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.steps b{color:var(--pen)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:4px;padding:6px 14px;cursor:pointer;background:var(--surface);font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen);font-weight:600}
textarea,input[type=text]{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;resize:vertical;min-height:44px}
textarea:focus,input[type=text]:focus{border-color:var(--pen);outline:none}
.q{font-family:var(--display);font-size:1.35rem;line-height:1.25}

.big{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.wins{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hbars{display:grid;gap:8px}
.saved-idea{border-top:1px solid var(--staff);padding-top:12px;margin-top:12px;display:grid;gap:6px}
.saved-idea:first-of-type{border-top:0;margin-top:0;padding-top:0}
.hb{display:grid;grid-template-columns:5em minmax(0,1fr) 2.2em;gap:8px;align-items:center;font-size:.9rem}
.hb .track{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;display:flex}
.hb .track i{display:block;height:100%}
.hb .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:end}
.demo-banner{background:var(--auto);color:var(--bg);border-radius:4px;padding:6px 12px;font-size:.85rem;font-weight:600}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;background:var(--bg);border-top:1px solid var(--staff);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:5}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;align-items:end;gap:4px}
.tab{background:none;border:none;cursor:pointer;padding:6px 2px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:.8rem}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--pen);font-weight:600}
.moment-btn{justify-self:center;background:var(--pen);color:var(--on-pen);border:none;border-radius:999px;padding:12px 16px;font-weight:600;cursor:pointer;font-size:.9rem;transform:translateY(-10px);white-space:nowrap}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.ov-in{max-width:480px;margin:0 auto;display:grid;gap:18px}
.close{justify-self:start;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:4px 0}
.ferm{width:200px;max-width:100%;display:block;margin:12px auto 0;transform-origin:center bottom}
.ferm .arc{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:round}
.ferm .dotp{fill:var(--pen)}
.ferm line{stroke:var(--staff)}
@media (prefers-reduced-motion:no-preference){.ferm.in{animation:hold 4s ease-in-out forwards}.ferm.out{animation:release 4s ease-in-out forwards}}
@keyframes hold{from{transform:scaleX(.75)}to{transform:scaleX(1.08)}}
@keyframes release{from{transform:scaleX(1.08)}to{transform:scaleX(.75)}}
.breath-word{font-family:var(--display);font-size:2.3rem;text-align:center}
.center{text-align:center}
.help{border-color:var(--warn)}
.help .eyebrow{color:var(--warn)}
.phone{font-family:var(--display);font-size:1.4rem;direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;inset:auto 0 calc(96px + env(safe-area-inset-bottom, 0px)) 0;display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--bg);border-radius:4px;padding:8px 18px;font-weight:600;font-size:.92rem}
.opt{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:12px 16px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--pen)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--pen)}
.foot{font-size:.8rem;color:var(--muted);text-align:center;display:grid;gap:4px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.hero-title{font-size:2.5rem}

/* ===== Calm version: "an island of sanity in the race of life" =====
   Still water at dawn: misty sage ground, deep slate ink, one warm candle-gold accent (נר ה׳ נשמת אדם).
   No boxes, no counters, wide air, slow light motion. */
:root{
  --bg:#EDF1EE; --surface:#F4F7F5; --sunk:#E1E8E3; --ink:#22302C; --muted:#5D6A65; --line:#D3DCD6;
  --staff:#C3CEC7; --pen:#8F5E18; --pen-soft:rgba(196,140,52,.13); --on-pen:#FFFFFF; --good:#446F57; --auto:#7D5E76; --warn:#A33A2C;
  --display:"Noto Serif Hebrew","Frank Ruhl Libre",Georgia,serif;
  --body:"Assistant","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(214,160,72,.16), transparent 70%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#16201D; --sunk:#1D2925; --ink:#E3EAE6; --muted:#97A59F; --line:#26332F;
  --staff:#33423D; --pen:#E2B15C; --pen-soft:rgba(226,177,92,.12); --on-pen:#1A1408; --good:#7DBB96; --auto:#C3A0BC; --warn:#F08A7C;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(226,177,92,.10), transparent 70%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#16201D; --sunk:#1D2925; --ink:#E3EAE6; --muted:#97A59F; --line:#26332F;
  --staff:#33423D; --pen:#E2B15C; --pen-soft:rgba(226,177,92,.12); --on-pen:#1A1408; --good:#7DBB96; --auto:#C3A0BC; --warn:#F08A7C;
  --glow:radial-gradient(120% 80% at 50% 0%, rgba(226,177,92,.10), transparent 70%); color-scheme:dark}

body{font-size:17.5px;line-height:1.85;font-weight:400;background:var(--bg)}
.app{gap:44px;max-width:440px;padding-block:16px 140px}
h1,h2,h3{font-weight:400;letter-spacing:-.005em}
.brand{font-size:1.25rem;font-weight:400;color:var(--muted)}
.theme-chip{color:var(--muted)}
.iconbtn{border:none;color:var(--muted);padding:4px 6px;font-size:.88rem}
/* no boxes: sections are separated by air and a short hairline */
.card{background:none;border:none;border-radius:0;padding:0;gap:14px}
.card + .card::before{content:"";display:block;width:36px;height:1px;background:var(--line);margin:0 auto 28px}
.card.accent{background:var(--glow);border:none;border-radius:24px;padding:28px 20px}
.card + .card.accent::before{display:none}
.eyebrow{font-weight:400;letter-spacing:.08em;color:var(--pen);font-size:.82rem}
.label{font-weight:400;color:var(--muted)}
.insight-title{font-size:2.3rem;line-height:1.2}
.q{font-size:1.45rem;line-height:1.45}
.action{border-inline-start:none;padding:0;gap:14px}
.btn{border-radius:999px;background:var(--pen);border-color:var(--pen);color:var(--on-pen);font-weight:400;padding:10px 26px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.done{background:none}
.chip{border-radius:999px;background:none;border-color:var(--line)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:400}
textarea,input[type=text]{background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px}
.opt{background:none;border-radius:16px}
.margin{border-inline-start-color:var(--line)}
.margin b{font-weight:400;color:var(--pen)}
.nav{background:var(--bg);border-top:none}
.tab[aria-current="page"]{font-weight:400}
.moment-btn{background:none;color:var(--pen);border:1px solid var(--pen);font-weight:400;transform:translateY(-6px)}
.toast span{border-radius:999px;font-weight:400}
.foot{opacity:.8}
.stf .n-ink{fill:var(--muted)}
.stf line.stem-ink{stroke:var(--muted)}
.quiet-win{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font-size:.95rem;text-decoration:underline;text-underline-offset:4px}
.dots5{display:flex;gap:10px;align-items:center;justify-content:center}
.dots5 i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots5 i.on{background:var(--pen);width:9px;height:9px}
/* logo: the note and the flame */
.candles{display:block;max-width:100%}
.candles .base{stroke:var(--staff);stroke-width:1.5}
.candles .wax{fill:var(--surface);stroke:var(--staff);stroke-width:1.2}
.candles .fl{fill:var(--pen)}
.candles text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.intent{color:var(--muted);font-size:.95rem;text-align:center}
.intent b{color:var(--ink);font-weight:400}
/* logo: the pause (fermata). Stop on the note. */
.mark{display:inline-block;vertical-align:-.05em;width:1.5em;height:.88em;margin-inline-end:.4em}
.mark .arc{fill:none;stroke:var(--pen);stroke-width:9;stroke-linecap:round} .mark .dot{fill:var(--ink)}
.mark.big{display:block;width:84px;height:49px;margin:0 0 10px}
.demo-banner{background:none;color:var(--muted);border:1px dashed var(--line);border-radius:999px;font-weight:400;text-align:center;padding:4px 14px}
textarea{resize:none}
.team summary{cursor:pointer;color:var(--muted);font-size:.9rem;list-style:none}
.team summary::-webkit-details-marker{display:none}
.team[open] summary{margin-bottom:14px}
/* slow light: sections settle in, from an almost-visible resting state */
@media (prefers-reduced-motion:no-preference){
  #app > *{animation:settle 1.4s ease-out both}
  #app > *:nth-child(2){animation-delay:.15s} #app > *:nth-child(3){animation-delay:.3s} #app > *:nth-child(4){animation-delay:.45s}
}
@keyframes settle{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
/* the threshold: a short pause before entering */
.threshold{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center;cursor:pointer;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s ease}
.threshold.gone{opacity:0;pointer-events:none}
.threshold .orb{width:120px;height:120px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle,var(--pen-soft),transparent 70%);border:1px solid var(--pen)}
@media (prefers-reduced-motion:no-preference){.threshold .orb{animation:orb 4s ease-in-out infinite}}
@keyframes orb{0%,100%{transform:scale(.8)}50%{transform:scale(1.05)}}
.threshold p{font-family:var(--display);font-size:1.7rem;line-height:1.4}
.threshold small{display:block;margin-top:14px;color:var(--muted);font-size:.85rem}
</style>

<div class="app" id="app" dir="rtl" lang="he"><div class="loading">טוען…</div></div>
<nav class="nav" id="nav" hidden aria-label="ניווט" dir="rtl" lang="he">
  <div class="nav-in">
    <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>היום</button>
    <button class="tab" data-tab="debrief" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>התבוננות</button>
    <button class="moment-btn" data-act="moment" type="button">אני באוטומט</button>
    <button class="tab" data-tab="map" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6h20M2 10h20M2 14h20M2 18h20"/><ellipse cx="9" cy="16" rx="2.6" ry="2" fill="currentColor"/></svg>המפה</button>
  </div>
</nav>
<div id="overlay" dir="rtl" lang="he"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="threshold" id="threshold" dir="rtl" lang="he" role="button" tabindex="0" aria-label="כניסה">
  <div><div class="orb"></div><p>עצור רגע.<br>נשימה אחת, ואז נכנסים.</p><small>נגיעה כדי להיכנס</small></div>
</div>
<script>
(function(){
  const t = document.getElementById("threshold"); let done = false;
  const enter = () => { if(done) return; done = true; t.classList.add("gone"); setTimeout(() => t.remove(), 1300); };
  t.addEventListener("click", enter); t.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" ") enter(); });
  setTimeout(enter, 4200);
})();
</script>

<script>
(function(){
/* ---------- content (original wording; the Tanya first, other sources cited by name) ---------- */
const POWERS = [
 {key:"thought", name:"מחשבה", items:[
  {t:"מחשבה היא לא אתה", x:"לפי התניא, גם אצל הבינוני עולות מחשבות שהוא לא בחר בהן. ההבדל הוא לא במה שעולה, אלא במה שאתה עושה עם זה: לא להתווכח עם המחשבה ולא להתעסק בה, אלא להסיט ממנה את תשומת הלב.", s:"תניא, פרק י״ב", a:"כשעולה היום מחשבה מטרידה, תן לה שם (״זה האוטומט״) ועבור לדבר אחר תוך עשר שניות."},
  {t:"המחשבה היא לבוש", x:"התניא מתאר שלושה לבושים שדרכם הנפש פועלת בעולם: מחשבה, דיבור ומעשה. מי שמנהל את המחשבה מתחיל לנהל את כל השאר.", s:"תניא, פרק ד׳", a:"בחר מחשבה אחת שתחזור אליה היום בכל פעם שאתה מחכה: בתור, ברמזור, מול הטלפון."}]},
 {key:"speech", name:"דיבור", items:[
  {t:"מה יוצא מהפה", x:"הבינוני, לפי התניא, אולי לא שולט במה שעולה בלב, אבל הוא שולט במה שיוצא מהפה. בין הרגש לבין המילה יש רגע של בחירה.", s:"תניא, פרק י״ב", a:"לפני משפט אחד שעומד לצאת בכעס או בעלבון, עצור לנשימה אחת. אם צריך, אל תגיד אותו."},

 {"n":"יסוד שבחסד","t":"בית פתוח","x":"יוסי בן יוחנן אומר: ״יהי ביתך פתוח לרוחה״. נתינה שיש בה יסוד יוצרת קשר: היא לא רק נותנת חפץ או זמן, היא פותחת דלת. בית פתוח הוא מקום שאנשים רוצים לחזור אליו.","s":"משנה, אבות א׳, ה׳","a":"הזמן היום מישהו לקפה, לארוחה או לשיחה, גם אם הבית לא מסודר."},
 {"n":"מלכות שבחסד","t":"נתינה עם כבוד","x":"מלכות היא הנוכחות והכבוד שבמעשה. חסד שיש בו מלכות נותן כך שהמקבל נשאר זקוף: בלי להקטין אותו, בלי לחנך אותו, ובלי להזכיר לו אחר כך. כך נחתם השבוע הראשון: נתינה שמגיעה עד המעשה.","s":"ספירת העומר (על פי הקבלה)","a":"כשאתה עוזר היום למישהו, עשה את זה כך שירגיש שווה לך, לא חייב לך."},
 {"n":"חסד שבגבורה","t":"גבול מתוך אהבה","x":"התניא מתאר שבלב יש שני כוחות, גבורה וחסד: ״הלב – כלול משתיהן״. גם הגבול הכי ברור יכול לבוא מאהבה. ״לא״ שנאמר בחום שומר על הקשר, ולא סוגר אותו.","s":"תניא, פרק ל״א","a":"כשאתה מציב היום גבול, הוסף לו משפט חם אחד: למה זה חשוב לך, או מה כן אפשר."},
 {"n":"גבורה שבגבורה","t":"גבור מבפנים","x":"המשנה שואלת: ״איזהו גבור, הכובש את יצרו״. לא מי שמנצח אחרים, אלא מי שמנהל את עצמו. גבורה שבגבורה היא הרגע שבו אתה מרגיש דחף חזק, ועוצר לפניו.","s":"משנה, אבות ד׳, א׳","a":"בחר דחף קטן אחד היום, כמו לבדוק את הטלפון או לענות בחדות, ודחה אותו בעשר דקות."},
 {"n":"תפארת שבגבורה","t":"קשה לכעוס, קל להתפייס","x":"המשנה מתארת את המידה הטובה ביותר בכעס: ״קשה לכעס ונוח לרצות״. גבורה שיש בה תפארת לא מוותרת על הגבול, אבל גם לא נאחזת בכעס. היא אומרת את שלה, ומשאירה דלת פתוחה לפיוס.","s":"משנה, אבות ה׳, י״א","a":"אם כעסת היום על מישהו, עשה צעד אחד קטן לקראתו לפני שהיום נגמר."},
 {"n":"נצח שבגבורה","t":"להתגבר כארי","x":"התניא מדבר על הכובד ש״מפיל עליו עצלה״, ומציע ״להתגבר כארי בגבורה ואומץ הלב״. לא בכעס על עצמך, אלא בעמידה יציבה: עוד פעם, ועוד פעם. גבורה שמתמידה לאורך זמן.","s":"תניא, פרק כ״ה","a":"קבע היום שעה לדבר אחד שאתה דוחה, ועמוד בה גם אם אין חשק."},
 {"n":"הוד שבגבורה","t":"כוחה של שתיקה","x":"רבי עקיבא אומר: ״סיג לחכמה, שתיקה״. לפעמים הגבורה היא לא לומר: לא להוסיף עוד מילה בוויכוח, לא לתקן, לא להוכיח שצדקת. שתיקה כזו היא לא חולשה, אלא הקשבה.","s":"משנה, אבות ג׳, י״ג","a":"בשיחה אחת היום, כשאתה רוצה להוסיף עוד משפט, עצור והקשב במקום."},
 {"n":"יסוד שבגבורה","t":"לא בשעת כעסו","x":"רבי שמעון בן אלעזר אומר: ״אל תרצה את חברך בשעת כעסו״. גם בקשר קרוב יש עיתוי. לפעמים הדבר הכי מחבר הוא לחכות, לתת לסערה לעבור, ולחזור לדבר כשאפשר באמת לשמוע.","s":"משנה, אבות ד׳, י״ח","a":"אם מישהו קרוב כועס היום, אל תמהר לשכנע. אמור שאתה כאן, וחזור לזה אחר כך."},
 {"n":"מלכות שבגבורה","t":"מושל ברוחו","x":"המשנה מביאה את הפסוק ״ומשל ברוחו מלכד עיר״: מי ששולט ברוחו חזק ממי שכובש עיר. זו מלכות אמיתית: לא שליטה באחרים, אלא נוכחות שקטה ויציבה גם כשמשהו בפנים סוער.","s":"משלי ט״ז, ל״ב (במשנה, אבות ד׳, א׳)","a":"כשמשהו מרגיז אותך היום, נשום שלוש נשימות לפני שאתה מגיב, ושים לב מי מחליט."},
 {"n":"חסד שבתפארת","t":"רחמים, גם על עצמך","x":"התניא מתאר את מידתו של יעקב, ״שהיא מדת הרחמים״, ומציע לעורר רחמים קודם כול על הנשמה של האדם עצמו, על האני העמוק שלו. רחמים אמיתיים מתחילים בבית.","s":"תניא, פרק מ״ה","a":"כשתתפוס את עצמך היום בביקורת עצמית, דבר אל עצמך כמו שהיית מדבר אל חבר טוב."},
 {"n":"גבורה שבתפארת","t":"אמת עם עמוד שדרה","x":"רבן שמעון בן גמליאל אומר שהעולם עומד ״על הדין ועל האמת ועל השלום״. אמת צריכה לפעמים אומץ: לומר את מה שנכון גם כשלא נוח. אבל היא באה לצד השלום, לא נגדו.","s":"משנה, אבות א׳, י״ח","a":"אמור היום דבר אמיתי אחד שהיית מעדיף לבלוע, בעדינות ובלי לפגוע."},
 {"n":"תפארת שבתפארת","t":"ימין, שמאל ואמצע","x":"התניא מתאר שלוש בחינות, ״ימין ושמאל ואמצע״: חסד, דין ורחמים. תפארת היא האמצע, הגוף שמחבר בין שתי הזרועות. לא ויתור על אחת מהן, אלא מקום שבו שתיהן נפגשות.","s":"תניא, פרק מ״ו","a":"בהחלטה אחת היום, כתוב מה הלב אומר ומה השכל אומר, וחפש דרך שמכבדת את שניהם."},
 {"n":"נצח שבתפארת","t":"אמת בלי תקרה","x":"התניא קורא למידת האמת ״נחלה בלי מצרים״: אין לה גבול למעלה. ובכל זאת, גם מי שבאמצע הדרך עובד באמת שלו, ״איש איש כפי מדרגתו״. אפשר להמשיך לצמוח בלי לבטל את מה שכבר יש.","s":"תניא, פרק י״ג","a":"כתוב דבר אחד שבו גדלת בשנה האחרונה, ודבר אחד שאתה רוצה לגדול בו עוד."},
 {"n":"הוד שבתפארת","t":"מודה על האמת","x":"המשנה מונה את סימני החכם, וביניהם: ״ועל מה שלא שמע, אומר לא שמעתי, ומודה על האמת״. להודות שאינך יודע, או שטעית, זו לא חולשה. זו אמת שיש בה ענווה.","s":"משנה, אבות ה׳, ז׳","a":"אמור היום פעם אחת ״אני לא יודע״ או ״טעיתי״, בלי להתנצל יותר מדי."},
 {"n":"יסוד שבתפארת","t":"רודף שלום","x":"הלל אומר: ״אוהב שלום ורודף שלום״. לא רק לאהוב שקט, אלא לרדוף אחרי שלום: ליזום, לגשר, להיות הראשון שמושיט יד. חיבור אמיתי נבנה ממי שמוכן לעשות את הצעד.","s":"משנה, אבות א׳, י״ב","a":"פנה היום למישהו שיש ביניכם מתח קטן, ואמור משפט אחד שמקרב."},
 {"n":"מלכות שבתפארת","t":"תפארת לעושיה","x":"רבי שואל מהי הדרך הישרה, ועונה: ״כל שהיא תפארת לעושיה ותפארת לו מן האדם״. דרך טובה מרגישה נכונה מבפנים וגם נראית טובה מבחוץ. כשהשניים נפגשים, יש יופי.","s":"משנה, אבות ב׳, א׳","a":"לפני החלטה אחת היום, שאל: האם זה נכון לי, והאם זה נכון גם לאנשים סביבי?"},
 {"n":"חסד שבנצח","t":"להתמיד מאהבה","x":"התמדה יכולה לבוא מעקשנות, ויכולה לבוא מאהבה. חסד שבנצח הוא להמשיך כי אכפת לך: באימון, בקשר, בפרויקט. לא כדי להוכיח, אלא כי זה חשוב לך. מה שנעשה מאהבה מחזיק יותר זמן.","s":"ספירת העומר (על פי הקבלה)","a":"בחר דבר אחד שאתה מתמיד בו, ונסח לעצמך במשפט אחד למה הוא יקר לך."},
 {"n":"גבורה שבנצח","t":"היום קצר","x":"רבי טרפון אומר: ״היום קצר והמלאכה מרבה״. התמדה צריכה גם גבול: לבחור על מה לא לעבוד היום. מי שמנסה להתקדם בכל החזיתות, נתקע. מי שבוחר מעט, מגיע רחוק.","s":"משנה, אבות ב׳, ט״ו","a":"כתוב את שלושת הדברים החשובים להיום, ומחק מהרשימה דבר אחד שיכול לחכות."},
 {"n":"תפארת שבנצח","t":"לא עליך לגמור","x":"רבי טרפון אומר: ״לא עליך המלאכה לגמר, ולא אתה בן חורין לבטל ממנה״. זה האיזון של ההתמדה: לא לשאת את כל המשימה על הכתפיים, וגם לא לוותר עליה. רק לעשות את החלק של היום.","s":"משנה, אבות ב׳, ט״ז","a":"בחר משימה גדולה שמכבידה עליך, ועשה בה היום צעד אחד, בלי לחשוב על הסוף."},
 {"n":"נצח שבנצח","t":"עז כנמר","x":"יהודה בן תימא אומר: ״הוי עז כנמר, וקל כנשר, ורץ כצבי, וגבור כארי״. ארבע חיות, ארבעה סוגי כוח. נצח שבנצח הוא להמשיך גם כשהמכשולים חוזרים, וגם כשההתלהבות הראשונה כבר עברה.","s":"משנה, אבות ה׳, כ׳","a":"חזור היום למשהו שהתחלת ועזבת, ועשה בו עוד צעד אחד, קטן ככל שיהיה."},
 {"n":"הוד שבנצח","t":"לשאול בלי להתבייש","x":"הלל אומר: ״ולא הבישן למד״. מי שמתבייש לשאול, נשאר במקום. התמדה אמיתית יודעת גם להודות: ״אני צריך כאן עזרה״. הענווה הזו לא עוצרת את הדרך, היא מקצרת אותה.","s":"משנה, אבות ב׳, ה׳","a":"שאל היום שאלה אחת שהתביישת לשאול, את מי שיכול לעזור לך."},
 {"n":"יסוד שבנצח","t":"להשקיע בחברות","x":"יהושע בן פרחיה אומר: ״וקנה לך חבר״. חברות לא באה מעצמה, צריך להשקיע בה, כמו בכל דבר יקר. יסוד שבנצח הוא להמשיך להיות שם: להתקשר, לשאול, לזכור, גם אחרי שנים.","s":"משנה, אבות א׳, ו׳","a":"התקשר היום לחבר שלא דיברתם מזמן, רק כדי לשאול מה שלומו."},
 {"n":"מלכות שבנצח","t":"לא לחכות לפנאי","x":"הלל אומר: ״ואל תאמר לכשאפנה אשנה, שמא לא תפנה״. הזמן הפנוי לא באמת מגיע. מלכות שבנצח היא להפוך כוונה למעשה עכשיו, במקום שבו אתה נמצא, עם הזמן שיש.","s":"משנה, אבות ב׳, ד׳","a":"בחר דבר אחד שאתה דוחה ״לכשיהיה זמן״, וקבע לו היום מועד ביומן."},
 {"n":"חסד שבהוד","t":"לכף זכות","x":"יהושע בן פרחיה אומר: ״והוי דן את כל האדם לכף זכות״. הוד הוא היכולת להכיר בטוב, גם אצל אחרים. כשמישהו מאכזב, אפשר לחפש את הסיבה הטובה שאולי עומדת מאחורי מה שעשה.","s":"משנה, אבות א׳, ו׳","a":"כשמישהו מרגיז אותך היום, חשוב על שתי סיבות טובות אפשריות למה שעשה."},
 {"n":"גבורה שבהוד","t":"ענווה בלי הקטנה","x":"התניא מביא את דברי המשנה ״ואל תהי רשע בפני עצמך״, ומסביר שמי שרואה את עצמו כרע, ליבו נעצב ואינו יכול לפעול בשמחה. ענווה אמיתית צריכה גבול: לא להקטין את עצמך עד שאין ממי לפעול.","s":"תניא, פרק א׳ (על פי משנה, אבות ב׳, י״ג)","a":"כשאתה שומע היום את עצמך מקטין את מה שעשית, עצור ואמור פשוט: עשיתי את זה."},
 {"n":"תפארת שבהוד","t":"השמח בחלקו","x":"בן זומא שואל: ״איזהו עשיר, השמח בחלקו״. העושר לא נמדד במה שיש, אלא במבט על מה שיש. תפארת שבהוד היא תודה כנה: לא להעמיד פנים שהכול מושלם, וגם לא לפספס את מה שטוב.","s":"משנה, אבות ד׳, א׳","a":"כתוב היום שלושה דברים שיש לך, ושהיית מתגעגע אליהם אילו חסרו."},
 {"n":"נצח שבהוד","t":"תודה כהרגל","x":"הכרת תודה היא לא רק רגש של רגע, אלא שריר שמתחזק בחזרה. נצח שבהוד הוא להודות שוב ושוב, גם ביום רגיל, גם על דברים קטנים. מי שמתרגל לראות את הטוב, רואה אותו יותר.","s":"ספירת העומר (על פי הקבלה)","a":"קבע לך רגע קבוע, למשל לפני השינה, ואמור בו תודה אחת על משהו מהיום."},
 {"n":"הוד שבהוד","t":"ל״ג בעומר: כבוד הדדי","x":"התלמוד מספר שתלמידי רבי עקיבא מתו בין פסח לעצרת ״מפני שלא נהגו כבוד זה לזה״. ל״ג בעומר, הוד שבהוד, נחשב במסורת ליום של שמחה בתוך הימים האלה. הוד בשיאו הוא לראות את הערך של מי שלידך.","s":"תלמוד, יבמות ס״ב ע״ב","a":"בחר מישהו שאתה רגיל לקבל כמובן מאליו, ואמור לו היום מה אתה מעריך בו."},
 {"n":"יסוד שבהוד","t":"ללמוד מכל אדם","x":"בן זומא שואל: ״איזהו חכם, הלומד מכל אדם״. מי שמוכן ללמוד מכל אחד, מתחבר לכל אחד. גם מי שצעיר ממך, שונה ממך, או לא מסכים איתך, יודע משהו שאתה עוד לא יודע.","s":"משנה, אבות ד׳, א׳","a":"שאל היום מישהו שונה ממך שאלה אחת, רק כדי ללמוד ממנו."},
 {"n":"מלכות שבהוד","t":"זנב לאריות","x":"רבי מתיא בן חרש אומר: ״והוי זנב לאריות, ואל תהי ראש לשועלים״. עדיף להיות האחרון בין אנשים שמרוממים אותך, מאשר הראשון במקום שמקטין. ענווה כזו היא בחירה של מלך: לבחור איפה לגדול.","s":"משנה, אבות ד׳, ט״ו","a":"חשוב על אנשים שלידם אתה גדל, ומצא היום דרך להיות במחיצתם עוד קצת."},
 {"n":"חסד שביסוד","t":"להקדים שלום","x":"רבי מתיא בן חרש אומר גם: ״הוי מקדים בשלום כל אדם״. חיבור מתחיל ממי שמושיט יד ראשון. ברכת שלום פשוטה, בלי לחכות שהאחר יפתח, אומרת: אני רואה אותך.","s":"משנה, אבות ד׳, ט״ו","a":"היה היום הראשון לומר שלום: לשכן, לנהג, לקופאית. ושים לב מה זה עושה."},

"כשתתפסי את עצמך היום מלקה את עצמך, החליפי את זה במשפט: ״ראיתי, למדתי, ממשיכים״.","ספור היום את הניצחונות הקטנים, ולחץ ״ניצחתי״ בכל פעם.":"ספרי היום את הניצחונות הקטנים, ולחצי ״ניצחתי״ בכל פעם.","לפני השינה, חשוב דקה על משהו גדול ממך שאתה חלק ממנו.":"לפני השינה, חשבי דקה על משהו גדול ממך שאת חלק ממנו.","עשה היום מעשה אור אחד קטן, דווקא במקום שמרגיש לך חשוך.":"עשי היום מעשה אור אחד קטן, דווקא במקום שמרגיש לך חשוך.","שים לב היום לרגע אחד שבו הרגשת את האני העמוק שלך דולק.":"שימי לב היום לרגע אחד שבו הרגשת את האני העמוק שלך דולק.","קח משהו טוב שעשית אתמול, ותוסיף לו היום עוד דקה אחת.":"קחי משהו טוב שעשית אתמול, ותוסיפי לו היום עוד דקה אחת.","אמור היום מילה טובה למישהו מחוץ למעגל הקרוב שלך.":"אמרי היום מילה טובה למישהו מחוץ למעגל הקרוב שלך.","עצור היום פעם אחת ושאל: לאן אני באמת רוצה לעלות?":"עצרי היום פעם אחת ושאלי: לאן אני באמת רוצה לעלות?","התחל היום משהו שדחית, עם מה שיש לך עכשיו, בלי לחכות לתנאים מושלמים.":"התחילי היום משהו שדחית, עם מה שיש לך עכשיו, בלי לחכות לתנאים מושלמים.","עזור היום למישהו להצליח, בשקט, בלי שיידעו שזה ממך.":"עזרי היום למישהו להצליח, בשקט, בלי שיידעו שזה ממך.","הסתכל אחורה על שמונת הימים, וכתוב משפט אחד על מה שהדלקת.":"הסתכלי אחורה על שמונת הימים, וכתבי משפט אחד על מה שהדלקת.","כתוב היום שאלה פתוחה אחת על השנה, בלי למהר לענות עליה.":"כתבי היום שאלה פתוחה אחת על השנה, בלי למהר לענות עליה.","בחר דבר אחד שאתה רוצה להרגיש יותר השנה, והקדש לו שתי דקות של התבוננות.":"בחרי דבר אחד שאת רוצה להרגיש יותר השנה, והקדישי לו שתי דקות של התבוננות.","כתוב היום במשפט אחד כוונה אחת לשנה הזו.":"כתבי היום במשפט אחד כוונה אחת לשנה הזו.","אמור בקול, לעצמך או למישהו קרוב, את הכוונה שלך לשנה.":"אמרי בקול, לעצמך או למישהו קרוב, את הכוונה שלך לשנה.","לפני שאתה מתחיל את היום, עצור דקה ושאל: בשביל מה אני עושה את זה?":"לפני שאת מתחילה את היום, עצרי דקה ושאלי: בשביל מה אני עושה את זה?","בחר הרגל אחד שאתה רוצה לעצור השנה, ועצור אותו היום פעם אחת.":"בחרי הרגל אחד שאת רוצה לעצור השנה, ועצרי אותו היום פעם אחת.","כתוב שלושה דברים מהשנה שעברה שאתה מודה עליהם.":"כתבי שלושה דברים מהשנה שעברה שאת מודה עליהם.","חזור היום לרעיון אחד שלמדת לאחרונה, ותן לו עוד חמש דקות.":"חזרי היום לרעיון אחד שלמדת לאחרונה, ותני לו עוד חמש דקות.","שים לב היום לגעגוע שקט אחד, למישהו או למשהו, ותן לו מקום.":"שימי לב היום לגעגוע שקט אחד, למישהו או למשהו, ותני לו מקום.","התניא כותב ש״ההרגל על כל דבר שלטון, ונעשה טבע שני״. מה שחוזר כל יום, משנה לאט את מי שאתה.":"התניא כותב ש״ההרגל על כל דבר שלטון, ונעשה טבע שני״. מה שחוזר כל יום, משנה לאט את מי שאת.","בחר מחשבה טובה אחת וחזור אליה היום שלוש פעמים, באותן שעות.":"בחרי מחשבה טובה אחת וחזרי אליה היום שלוש פעמים, באותן שעות.","אמור היום מילה חמה אחת בבית, דווקא ביום הכי רגיל.":"אמרי היום מילה חמה אחת בבית, דווקא ביום הכי רגיל.","עשה היום שוב את אותו מעשה טוב שעשית אתמול.":"עשי היום שוב את אותו מעשה טוב שעשית אתמול.","התניא מודה ש״לא כל העתים שוות״: יש ימים שהלב פחות שם. אבל הבחירה במעשה נשארת בידיך בכל יום.":"התניא מודה ש״לא כל העתים שוות״: יש ימים שהלב פחות שם. אבל הבחירה במעשה נשארת בידייך בכל יום.","גם אם היום הוא יום חלש, בחר דבר קטן אחד ועשה אותו.":"גם אם היום הוא יום חלש, בחרי דבר קטן אחד ועשי אותו.","התחל היום משימה אחת מיד, בלי לדחות, ושים לב לתחושה.":"התחילי היום משימה אחת מיד, בלי לדחות, ושימי לב לתחושה.","בחר רעיון אחד שאתה ״יודע״, ובדוק: האם הוא באמת משנה אצלך משהו?":"בחרי רעיון אחד שאת ״יודעת״, ובדקי: האם הוא באמת משנה אצלך משהו?","התבונן היום חמש דקות במשהו גדול ממך, עד שמשהו בך נדלק.":"התבונני היום חמש דקות במשהו גדול ממך, עד שמשהו בך נדלק.","כשמחשבה קודרת עולה היום, אל תתווכח איתה. הדלק לידה מחשבה טובה אחת.":"כשמחשבה קודרת עולה היום, אל תתווכחי איתה. הדליקי לידה מחשבה טובה אחת.","כשיש היום שני קולות בראש, תן לכל אחד לומר את דעתו, ואז הכרע.":"כשיש היום שני קולות בראש, תני לכל אחד לומר את דעתו, ואז הכריעי.","כשאתה עומד לבקר מישהו היום, שאל קודם: מה המקום שלו?":"כשאת עומדת לבקר מישהו היום, שאלי קודם: מה המקום שלו?","עשה היום מעשה טוב אחד ממשי, ביד, לא רק בכוונה.":"עשי היום מעשה טוב אחד ממשי, ביד, לא רק בכוונה.","אם היה לך היום רגע עצוב, שאל: מה אני לוקח ממנו הלאה?":"אם היה לך היום רגע עצוב, שאלי: מה אני לוקחת ממנו הלאה?","התניא מסביר ש״דעת הוא לשון התקשרות״: לדעת זה להתחבר, לא רק להכיר. בימים קרים, מה שמחזיק אותך הוא מה שאתה באמת קשור אליו.":"התניא מסביר ש״דעת הוא לשון התקשרות״: לדעת זה להתחבר, לא רק להכיר. בימים קרים, מה שמחזיק אותך הוא מה שאת באמת קשורה אליו.","כתוב דבר אחד שאתה יודע שהוא נכון, ושאל: איך אני נקשר אליו היום?":"כתבי דבר אחד שאת יודעת שהוא נכון, ושאלי: איך אני נקשרת אליו היום?","כשמשהו קשה היום, אמור לעצמך: זו היגיעה, לא כישלון.":"כשמשהו קשה היום, אמרי לעצמך: זו היגיעה, לא כישלון.","בחר משפט אחד שאתה אומר כל יום, כמו ״תודה״ או ״בוקר טוב״, ואמור אותו היום בכוונה.":"בחרי משפט אחד שאת אומרת כל יום, כמו ״תודה״ או ״בוקר טוב״, ואמרי אותו היום בכוונה.","כשדחף עולה היום, תן לו להיות, ואל תעשה אותו. רק פעם אחת.":"כשדחף עולה היום, תני לו להיות, ואל תעשי אותו. רק פעם אחת.","התניא כותב על מי שמשתדל גם בלי לראות תוצאות: ״הוא יעשה את שלו״. לא הכול בידיך, אבל החלק שלך כן.":"התניא כותב על מי שמשתדל גם בלי לראות תוצאות: ״הוא יעשה את שלו״. לא הכול בידייך, אבל החלק שלך כן.","בחר משימה אחת שאתה מתייאש ממנה, ועשה בה היום רק את החלק שלך.":"בחרי משימה אחת שאת מתייאשת ממנה, ועשי בה היום רק את החלק שלך.","קבע היום עשר דקות, בשעה קבועה, למשהו שמשמח אותך באמת.":"קבעי היום עשר דקות, בשעה קבועה, למשהו שמשמח אותך באמת.","בחר דבר אחד שאתה עושה כל יום, ושאל עליו ״למה?״ שלוש פעמים.":"בחרי דבר אחד שאת עושה כל יום, ושאלי עליו ״למה?״ שלוש פעמים.","חשוב על תכונה טובה אחת שקיבלת מהורה או מסבא, והשתמש בה היום.":"חשבי על תכונה טובה אחת שקיבלת מהורה או מסבא, והשתמשי בה היום.","למד היום רעיון אחד לעומק, עד שתוכל להסביר אותו במילים שלך.":"למדי היום רעיון אחד לעומק, עד שתוכלי להסביר אותו במילים שלך.","כשאתה מדבר היום עם מישהו שאתה לא מסכים איתו, חפש דבר אחד משותף.":"כשאת מדברת היום עם מישהו שאת לא מסכימה איתו, חפשי דבר אחד משותף.","בחר מעשה שגרתי אחד היום, ועשה אותו בשביל מטרה שחשובה לך.":"בחרי מעשה שגרתי אחד היום, ועשי אותו בשביל מטרה שחשובה לך.","בחר שינוי קטן מאוד, ועשה אותו כל יום השבוע.":"בחרי שינוי קטן מאוד, ועשי אותו כל יום השבוע.","שמח היום בדבר אחד שעוד לא הצליח, אבל אתה עובד עליו.":"שמחי היום בדבר אחד שעוד לא הצליח, אבל את עובדת עליו.","למד היום משהו חדש עד שמגיע ה״אהה״, ושים לב לשמחה שבו.":"למדי היום משהו חדש עד שמגיע ה״אהה״, ושימי לב לשמחה שבו.","ביום עייף, מצא רגע אחד של שמחה שלא תלוי בכמה כוח יש לך.":"ביום עייף, מצאי רגע אחד של שמחה שלא תלוי בכמה כוח יש לך.","כשמשהו מושך אותך היום, הפנה את אותה אנרגיה למשהו שמשמח אחרים.":"כשמשהו מושך אותך היום, הפני את אותה אנרגיה למשהו שמשמח אחרים.","כתוב דאגה קטנה אחת, ומתחתיה: מה אני יכול לעשות, ומה לא בידיי.":"כתבי דאגה קטנה אחת, ומתחתיה: מה אני יכולה לעשות, ומה לא בידיי.","על כל פעם שאדם עוצר דחף, התניא אומר ש״צריך לשמוח בקיום הלאו, כמו בקיום מצות עשה ממש״. גם ״לא״ שאמרת הוא סיבה לשמוח.":"על כל פעם שאדם עוצר דחף, התניא אומר ש״צריך לשמוח בקיום הלאו, כמו בקיום מצות עשה ממש״. גם ״לא״ שאמרת הוא סיבה לשמוח.","עשה היום דבר טוב אחד בגודל שמתאים לך, ושמח בו.":"עשי היום דבר טוב אחד בגודל שמתאים לך, ושמחי בו.","בחר היום דבר אחד, ושמח בו בלב שלם, כאילו הוא היחיד.":"בחרי היום דבר אחד, ושמחי בו בלב שלם, כאילו הוא היחיד.","כשאתה תופס את עצמך באוטומט היום, שאל: מאיפה זה נולד?":"כשאת תופסת את עצמך באוטומט היום, שאלי: מאיפה זה נולד?","כשכעס עולה היום כלפי מישהו, עשה בשבילו דבר טוב קטן.":"כשכעס עולה היום כלפי מישהו, עשי בשבילו דבר טוב קטן.","זהה היום ״מצרים״ קטנה אחת, הרגל שכובל אותך, וצא ממנה פעם אחת.":"זהי היום ״מצרים״ קטנה אחת, הרגל שכובל אותך, וצאי ממנה פעם אחת.","כשמחשבה שלילית על מישהו עולה היום, אל תגיד אותה. רק היום.":"כשמחשבה שלילית על מישהו עולה היום, אל תגידי אותה. רק היום.","עשה היום דבר רגיל אחד פעם אחת יותר ממה שאתה רגיל.":"עשי היום דבר רגיל אחד פעם אחת יותר ממה שאת רגילה.","אם יש מקום או מצב שמושך אותך לאוטומט, צא ממנו היום, גם בלי לנצח אותו בפנים.":"אם יש מקום או מצב שמושך אותך לאוטומט, צאי ממנו היום, גם בלי לנצח אותו בפנים.","כשמשהו מסיח אותך היום מדבר חשוב, חזור אליו בחיוך.":"כשמשהו מסיח אותך היום מדבר חשוב, חזרי אליו בחיוך.","לפי התניא, ״הדעת הוא קיום המדות וחיותן״: מה שאתה יודע לעומק הוא מה שמחזיק את הרגש בחיים. בימי העבודה על המידות, השכל הוא השורש.":"לפי התניא, ״הדעת הוא קיום המדות וחיותן״: מה שאת יודעת לעומק הוא מה שמחזיק את הרגש בחיים. בימי העבודה על המידות, השכל הוא השורש.","לפני שאתה עובד היום על מידה, הסבר לעצמך במשפט אחד למה היא חשובה לך.":"לפני שאת עובדת היום על מידה, הסבירי לעצמך במשפט אחד למה היא חשובה לך.","לפי התניא, ״שאר המדות כולן, הן ענפי היראה והאהבה״. כל מידה שאתה עובד עליה יוצאת מאחד משני השורשים האלה.":"לפי התניא, ״שאר המדות כולן, הן ענפי היראה והאהבה״. כל מידה שאת עובדת עליה יוצאת מאחד משני השורשים האלה.","כשאתה כועס או חושש היום, שאל: זה בא מאהבה או מפחד?":"כשאת כועסת או חוששת היום, שאלי: זה בא מאהבה או מפחד?","עשה היום משהו נכון, גם בלי שהלב מסכים.":"עשי היום משהו נכון, גם בלי שהלב מסכים.","בחר מידה אחת מהשבע לשבוע הזה, ושים לב אליה כל יום.":"בחרי מידה אחת מהשבע לשבוע הזה, ושימי לב אליה כל יום.","בחר היום מצב אחד שבדרך כלל מעצבן אותך, והחזק סבלנות עד הסוף.":"בחרי היום מצב אחד שבדרך כלל מעצבן אותך, והחזיקי סבלנות עד הסוף.","לפני השינה, דמיין במשך דקה את האדם שאתה רוצה להיות בסוף ימי הספירה.":"לפני השינה, דמייני במשך דקה את האדם שאת רוצה להיות בסוף ימי הספירה.","נסח לעצמך היום כלל אחד ברור, ״אצלי זה ככה״, ושמור אותו.":"נסחי לעצמך היום כלל אחד ברור, ״אצלי זה ככה״, ושמרי אותו.","קבל היום אדם אחד כמו שהוא, בלי לנסות לשנות אותו.":"קבלי היום אדם אחד כמו שהוא, בלי לנסות לשנות אותו.","קבע לעצמך היום התחייבות אחת קטנה לחודש, ורשום אותה.":"קבעי לעצמך היום התחייבות אחת קטנה לחודש, ורשמי אותה.","החלט הבוקר מה תעשה ברגע הקשה של היום, לפני שהוא מגיע.":"החליטי הבוקר מה תעשי ברגע הקשה של היום, לפני שהוא מגיע.","בתניא, הדיבור הוא אחד משלושת הלבושים שדרכם אדם מקבל על עצמו: ״ובדבור הוא עוסק״ במה שלמד. מה שאומרים בקול, מתחייבים אליו.":"בתניא, הדיבור הוא אחד משלושת הלבושים שדרכם אדם מקבל על עצמו: ״ובדבור הוא עוסק״ במה שלמד. מה שאומרים בקול, מתחייבים אליו.","אמור בקול, למישהו, דבר אחד שאתה מתחייב אליו.":"אמרי בקול, למישהו, דבר אחד שאת מתחייבת אליו.","התניא מסביר שהבינוני אולי לא מואס ברע בלב, אבל ״סור מרע ועשה טוב, דהיינו בפועל ממש״. המחויבות נמדדת במעשה.":"התניא מסביר שהבינוני אולי לא מואס ברע בלב, אבל ״סור מרע ועשה טוב, דהיינו בפועל ממש״. המחויבות נמדדת במעשה.","הפוך היום כוונה אחת למעשה ממשי, עם שעה ומקום.":"הפכי היום כוונה אחת למעשה ממשי, עם שעה ומקום.","קבע זמן קבוע לדבר אחד שחשוב לך, ושמח כשאתה מגיע אליו.":"קבעי זמן קבוע לדבר אחד שחשוב לך, ושמחי כשאת מגיעה אליו.","כתוב דבר אחד שהבנת על עצמך בתקופה טובה, וקרא אותו היום.":"כתבי דבר אחד שהבנת על עצמך בתקופה טובה, וקראי אותו היום.","כשאתה שופט את עצמך היום, שאל: מה המקום שלי עכשיו?":"כשאת שופטת את עצמך היום, שאלי: מה המקום שלי עכשיו?","אם הלב סגור היום, אל תילחם בו. עשה רק דבר קטן אחד, ותן לו זמן.":"אם הלב סגור היום, אל תילחמי בו. עשי רק דבר קטן אחד, ותני לו זמן.","כשמחשבה קשה אומרת לך ״זה אבוד״, אמור לה: זו דעה, לא פסק דין.":"כשמחשבה קשה אומרת לך ״זה אבוד״, אמרי לה: זו דעה, לא פסק דין.","אמור לעצמך היום משפט נחמה אחד, כמו שהיית אומר לחבר טוב.":"אמרי לעצמך היום משפט נחמה אחד, כמו שהיית אומרת לחברה טובה.","מעשה אחד בידיך":"מעשה אחד בידייך","התניא אומר שכל אדם יכול ״שלא למלאת משאלות לבו במעשה דבור ומחשבה״. גם כשהכול נשבר, נשאר מעשה אחד שבידיך.":"התניא אומר שכל אדם יכול ״שלא למלאת משאלות לבו במעשה דבור ומחשבה״. גם כשהכול נשבר, נשאר מעשה אחד שבידייך.","בחר היום פעולה אחת שתשמור עליך, ועשה אותה גם בלי כוח.":"בחרי היום פעולה אחת שתשמור עלייך, ועשי אותה גם בלי כוח.","כשמשהו נופל היום, אמור לעצמך: הרגשתי, ואני עדיין עומד.":"כשמשהו נופל היום, אמרי לעצמך: הרגשתי, ואני עדיין עומדת.","כתוב משפט אחד שמסביר לך את מה שקרה בדרך חדשה, טובה יותר.":"כתבי משפט אחד שמסביר לך את מה שקרה בדרך חדשה, טובה יותר.","נחם היום מישהו אחר, ושים לב מה זה עושה גם לך.":"נחמי היום מישהו אחר, ושימי לב מה זה עושה גם לך.","פנה היום במילה טובה לאדם שהתרחקת ממנו.":"פני היום במילה טובה לאדם שהתרחקת ממנו.","תן היום משהו, כסף, זמן או חפץ, למישהו שצריך.":"תני היום משהו, כסף, זמן או חפץ, למישהו שצריך.","אחרי טעות היום, אמור: היכולת לבחור עדיין אצלי. ובחר שוב.":"אחרי טעות היום, אמרי: היכולת לבחור עדיין אצלי. ובחרי שוב.","עשה היום משהו קטן שמשמח אותך, בלי להרגיש אשם על כך.":"עשי היום משהו קטן שמשמח אותך, בלי להרגיש אשמה על כך.","שב היום חמש דקות בלי טלפון, ושאל: מה באמת חשוב לי?":"שבי היום חמש דקות בלי טלפון, ושאלי: מה באמת חשוב לי?","חשוב על קשר אחד שהשתנה השנה, ועל מה שאתה רוצה להביא אליו.":"חשבי על קשר אחד שהשתנה השנה, ועל מה שאת רוצה להביא אליו.","בחר צד אחד בך שאתה רוצה לחזק, ועשה היום פעולה אחת בשבילו.":"בחרי צד אחד בך שאת רוצה לחזק, ועשי היום פעולה אחת בשבילו.","קבע היום עשר דקות לחשבון נפש קצר: מה הלך, מה לא, ומה לוקחים הלאה.":"קבעי היום עשר דקות לחשבון נפש קצר: מה הלך, מה לא, ומה לוקחים הלאה.","אמור לעצמך היום משפט אמת אחד על השנה, ואחריו משפט נחמה אחד.":"אמרי לעצמך היום משפט אמת אחד על השנה, ואחריו משפט נחמה אחד.","כתוב היום דבר אחד חשוב ששכחת השנה, וחזור אליו.":"כתבי היום דבר אחד חשוב ששכחת השנה, וחזרי אליו.","אחרי חשבון הנפש של היום, עשה משהו קטן שמשמח אותך.":"אחרי חשבון הנפש של היום, עשי משהו קטן שמשמח אותך.","שב בנוח. אם נוח לך, עצום עיניים. שלוש נשימות איטיות.":"שבי בנוח. אם נוח לך, עצמי עיניים. שלוש נשימות איטיות.","דמיין נר דולק לפניך, בחדר שקט. רק להבה אחת.":"דמייני נר דולק לפנייך, בחדר שקט. רק להבה אחת.","שים לב ללהבה: היא זזה כל הזמן, ותמיד כלפי מעלה. התניא מתאר את הנשמה ״כאור הנר שמתנענע תמיד למעלה בטבעו״.":"שימי לב ללהבה: היא זזה כל הזמן, ותמיד כלפי מעלה. התניא מתאר את הנשמה ״כאור הנר שמתנענע תמיד למעלה בטבעו״.","עכשיו הקשב: איפה בך יש משהו שרוצה לעלות? אולי בחזה, אולי בנשימה. אין צורך למצוא. רק להקשיב.":"עכשיו הקשיבי: איפה בך יש משהו שרוצה לעלות? אולי בחזה, אולי בנשימה. אין צורך למצוא. רק להקשיב.","שאל בשקט: לאן הלהבה שבי רוצה לעלות השבוע? חכה, ותן לתשובה לבוא מעצמה.":"שאלי בשקט: לאן הלהבה שבי רוצה לעלות השבוע? חכי, ותני לתשובה לבוא מעצמה.","אם עלתה מילה או תמונה, קח אותה איתך. אם לא, גם זה בסדר.":"אם עלתה מילה או תמונה, קחי אותה איתך. אם לא, גם זה בסדר.","שלוש נשימות. פתח את העיניים לאט, וחזור לחדר.":"שלוש נשימות. פתחי את העיניים לאט, וחזרי לחדר.","דמיין עיר קטנה ושקטה. זו העיר שלך: הגוף, הימים, ההרגלים.":"דמייני עיר קטנה ושקטה. זו העיר שלך: הגוף, הימים, ההרגלים.","הקשב לקול הראשון, האוטומט. מה הוא אומר לך השבוע? אל תתווכח איתו. רק שמע.":"הקשיבי לקול הראשון, האוטומט. מה הוא אומר לך השבוע? אל תתווכחי איתו. רק שמעי.","עכשיו הקשב לקול השני, העמוק. הוא שקט יותר. מה הוא רוצה בשבילך?":"עכשיו הקשיבי לקול השני, העמוק. הוא שקט יותר. מה הוא רוצה בשבילך?","דמיין שהעיר מקשיבה לקול העמוק ליום אחד. איך נראה היום הזה? רגע אחד ממנו מספיק.":"דמייני שהעיר מקשיבה לקול העמוק ליום אחד. איך נראה היום הזה? רגע אחד ממנו מספיק.","דמיין חדר חשוך. לא מפחיד, רק חשוך.":"דמייני חדר חשוך. לא מפחיד, רק חשוך.","מישהו מדליק אור קטן אחד. שים לב: החושך לא נלחם, הוא פשוט נסוג. ״שמעט אור גשמי דוחה הרבה מן החשך״.":"מישהו מדליק אור קטן אחד. שימי לב: החושך לא נלחם, הוא פשוט נסוג. ״שמעט אור גשמי דוחה הרבה מן החשך״.","דמיין אור קטן אחד שאתה מביא לשם. לא פתרון לכול, רק מעשה אחד קטן. מה הוא?":"דמייני אור קטן אחד שאת מביאה לשם. לא פתרון לכול, רק מעשה אחד קטן. מה הוא?","ראה את המקום הזה קצת יותר מואר. הישאר שם עוד נשימה אחת.":"ראי את המקום הזה קצת יותר מואר. הישארי שם עוד נשימה אחת.","דמיין אגם שקט. המים חלקים כמו מראה.":"דמייני אגם שקט. המים חלקים כמו מראה.","התכופף והבט: הפנים שלך משתקפות. אם תחייך, ההשתקפות מחייכת. ״כמים הפנים לפנים, כן לב האדם אל האדם״.":"התכופפי והביטי: הפנים שלך משתקפות. אם תחייכי, ההשתקפות מחייכת. ״כמים הפנים לפנים, כן לב האדם אל האדם״.","חשוב על אדם אחד קרוב. ראה את הפנים שלו.":"חשבי על אדם אחד קרוב. ראי את הפנים שלו.","שלח אליו בלב משהו טוב: הוקרה, סליחה, חום. אל תחפש מילים, רק תחושה.":"שלחי אליו בלב משהו טוב: הוקרה, סליחה, חום. אל תחפשי מילים, רק תחושה.","דמיין שהוא מקבל את זה, ומשהו מזה חוזר אליך, כמו במים.":"דמייני שהוא מקבל את זה, ומשהו מזה חוזר אלייך, כמו במים.","שהמחשבה, הדיבור והמעשה ישרתו את מה שאתה באמת רוצה.":"שהמחשבה, הדיבור והמעשה ישרתו את מה שאת באמת רוצה.","האם הדיבור שלך היום שירת את מה שאתה באמת רוצה?":"האם הדיבור שלך היום שירת את מה שאת באמת רוצה?","ויכוח בעבודה. מה אתה עושה?":"ויכוח בעבודה. מה את עושה?","יום פנוי לגמרי. מה תעשה?":"יום פנוי לגמרי. מה תעשי?","אתה נותן בלב שלם, ולידך אנשים מרגישים בבית.":"את נותנת בלב שלם, ולידך אנשים מרגישים בבית.","כשהנתינה בלי גבולות, אתה נשחק.":"כשהנתינה בלי גבולות, את נשחקת.","תן, וגם תשאיר משהו לעצמך.":"תני, וגם תשאירי משהו לעצמך.","אתה רואה את שני הצדדים ומחבר ביניהם.":"את רואה את שני הצדדים ומחברת ביניהם.","לא צריך איזון מושלם. בחר ותתחיל.":"לא צריך איזון מושלם. בחרי ותתחילי.","אתה לא מוותר, ומוביל דברים עד הסוף.":"את לא מוותרת, ומובילה דברים עד הסוף.","אתה יודע להודות, להקשיב ולהכיר בטעות.":"את יודעת להודות, להקשיב ולהכיר בטעות.","אתה בונה קשרים עמוקים ונאמנים.":"את בונה קשרים עמוקים ונאמנים.","אתה לוקח אחריות והופך כוונות למעשים.":"את לוקחת אחריות והופכת כוונות למעשים.","תעשה את זה בשקט, בלי שמישהו יראה.":"תעשי את זה בשקט, בלי שמישהו יראה.","בין הגירוי לתגובה יש רגע. אתה בתוכו עכשיו.":"בין הגירוי לתגובה יש רגע. את בתוכו עכשיו.","הדחף הוא לא אתה. אתה מי שבוחר מה לעשות איתו.":"הדחף הוא לא את. את מי שבוחרת מה לעשות איתו.","חשוב היום על אדם שקשה לך איתו, ועל מה שהוא אולי סוחב.":"חשבי היום על אדם שקשה לך איתו, ועל מה שהוא אולי סוחב.","חשוב על מקום אחד חשוך בשבוע שלך: מצב, קשר, הרגל.":"חשבי על מקום אחד חשוך בשבוע שלך: מצב, קשר, הרגל.","איפה היית היום שליח, ועשית משהו בשביל אחר?":"איפה היית היום שליחה, ועשית משהו בשביל אחר?","מיד. לא חושב פעמיים":"מיד. לא חושבת פעמיים","עוזר, אבל קובע גבול ברור":"עוזרת, אבל קובעת גבול ברור","מקשיב קודם, ואז מחליט מה נכון":"מקשיבה קודם, ואז מחליטה מה נכון","נשאר איתו עד הסוף":"נשארת איתו עד הסוף","על זה שאני לא מוותר":"על זה שאני לא מוותרת","על זה שאני יודע להקשיב ולהודות":"על זה שאני יודעת להקשיב ולהודות","על זה שאני לוקח אחריות":"על זה שאני לוקחת אחריות","עומד על העיקרון":"עומדת על העיקרון","מחפש דרך שמכילה את שני הצדדים":"מחפשת דרך שמכילה את שני הצדדים","מוכן להודות אם טעיתי":"מוכנה להודות אם טעיתי","מקבל החלטה ומתקדם":"מקבלת החלטה ומתקדמת","מארח אנשים":"מארחת אנשים","מקדם פרויקט אישי":"מקדמת פרויקט אישי","אומר כן כשהייתי צריך לומר לא":"אומרת כן כשהייתי צריכה לומר לא","דוחף יותר מדי ולא יודע לעצור":"דוחפת יותר מדי ולא יודעת לעצור","נאחז באנשים או בהרגלים":"נאחזת באנשים או בהרגלים","הנותן":"הנותנת","השומר":"השומרת","המאזן":"המאזנת","המתמיד":"המתמידה","המעריך":"המעריכה","המחבר":"המחברת","המוביל":"המובילה","תן היום משהו קטן למישהו, בלי שביקש ובלי לחכות לתודה.":"תני היום משהו קטן למישהו, בלי שביקש ובלי לחכות לתודה.","כשמבקשים ממך היום משהו שאין לך כוח אליו, אמור ״לא״ בנעימות, או הצע פחות.":"כשמבקשים ממך היום משהו שאין לך כוח אליו, אמרי ״לא״ בנעימות, או הציעי פחות.","לפני שאתה עוזר למישהו היום, שאל אותו: מה הכי יעזור לך עכשיו?":"לפני שאת עוזרת למישהו היום, שאלי אותו: מה הכי יעזור לך עכשיו?","בחר אדם אחד שאתה פוגש כל יום, ותן לו היום יחס חם גם ברגע שאתה עייף.":"בחרי אדם אחד שאת פוגשת כל יום, ותני לו היום יחס חם גם ברגע שאת עייפה.","כשמישהו מציע לך עזרה היום, קבל אותה, ואמור תודה בלי להתנצל.":"כשמישהו מציע לך עזרה היום, קבלי אותה, ואמרי תודה בלי להתנצל.","הזמן היום מישהו לקפה, לארוחה או לשיחה, גם אם הבית לא מסודר.":"הזמיני היום מישהו לקפה, לארוחה או לשיחה, גם אם הבית לא מסודר.","כשאתה עוזר היום למישהו, עשה את זה כך שירגיש שווה לך, לא חייב לך.":"כשאת עוזרת היום למישהו, עשי את זה כך שירגיש שווה לך, לא חייב לך.","כשאתה מציב היום גבול, הוסף לו משפט חם אחד: למה זה חשוב לך, או מה כן אפשר.":"כשאת מציבה היום גבול, הוסיפי לו משפט חם אחד: למה זה חשוב לך, או מה כן אפשר.","המשנה שואלת: ״איזהו גבור, הכובש את יצרו״. לא מי שמנצח אחרים, אלא מי שמנהל את עצמו. גבורה שבגבורה היא הרגע שבו אתה מרגיש דחף חזק, ועוצר לפניו.":"המשנה שואלת: ״איזהו גבור, הכובש את יצרו״. לא מי שמנצח אחרים, אלא מי שמנהל את עצמו. גבורה שבגבורה היא הרגע שבו את מרגישה דחף חזק, ועוצרת לפניו.","בחר דחף קטן אחד היום, כמו לבדוק את הטלפון או לענות בחדות, ודחה אותו בעשר דקות.":"בחרי דחף קטן אחד היום, כמו לבדוק את הטלפון או לענות בחדות, ודחי אותו בעשר דקות.","אם כעסת היום על מישהו, עשה צעד אחד קטן לקראתו לפני שהיום נגמר.":"אם כעסת היום על מישהו, עשי צעד אחד קטן לקראתו לפני שהיום נגמר.","קבע היום שעה לדבר אחד שאתה דוחה, ועמוד בה גם אם אין חשק.":"קבעי היום שעה לדבר אחד שאת דוחה, ועמדי בה גם אם אין חשק.","בשיחה אחת היום, כשאתה רוצה להוסיף עוד משפט, עצור והקשב במקום.":"בשיחה אחת היום, כשאת רוצה להוסיף עוד משפט, עצרי והקשיבי במקום.","אם מישהו קרוב כועס היום, אל תמהר לשכנע. אמור שאתה כאן, וחזור לזה אחר כך.":"אם מישהו קרוב כועס היום, אל תמהרי לשכנע. אמרי שאת כאן, וחזרי לזה אחר כך.","כשמשהו מרגיז אותך היום, נשום שלוש נשימות לפני שאתה מגיב, ושים לב מי מחליט.":"כשמשהו מרגיז אותך היום, נשמי שלוש נשימות לפני שאת מגיבה, ושימי לב מי מחליט.","כשתתפוס את עצמך היום בביקורת עצמית, דבר אל עצמך כמו שהיית מדבר אל חבר טוב.":"כשתתפסי את עצמך היום בביקורת עצמית, דברי אל עצמך כמו שהיית מדברת אל חברה טובה.","אמור היום דבר אמיתי אחד שהיית מעדיף לבלוע, בעדינות ובלי לפגוע.":"אמרי היום דבר אמיתי אחד שהיית מעדיפה לבלוע, בעדינות ובלי לפגוע.","בהחלטה אחת היום, כתוב מה הלב אומר ומה השכל אומר, וחפש דרך שמכבדת את שניהם.":"בהחלטה אחת היום, כתבי מה הלב אומר ומה השכל אומר, וחפשי דרך שמכבדת את שניהם.","כתוב דבר אחד שבו גדלת בשנה האחרונה, ודבר אחד שאתה רוצה לגדול בו עוד.":"כתבי דבר אחד שבו גדלת בשנה האחרונה, ודבר אחד שאת רוצה לגדול בו עוד.","המשנה מונה את סימני החכם, וביניהם: ״ועל מה שלא שמע, אומר לא שמעתי, ומודה על האמת״. להודות שאינך יודע, או שטעית, זו לא חולשה. זו אמת שיש בה ענווה.":"המשנה מונה את סימני החכם, וביניהם: ״ועל מה שלא שמע, אומר לא שמעתי, ומודה על האמת״. להודות שאינך יודעת, או שטעית, זו לא חולשה. זו אמת שיש בה ענווה.","אמור היום פעם אחת ״אני לא יודע״ או ״טעיתי״, בלי להתנצל יותר מדי.":"אמרי היום פעם אחת ״אני לא יודעת״ או ״טעיתי״, בלי להתנצל יותר מדי.","פנה היום למישהו שיש ביניכם מתח קטן, ואמור משפט אחד שמקרב.":"פני היום למישהו שיש ביניכם מתח קטן, ואמרי משפט אחד שמקרב.","לפני החלטה אחת היום, שאל: האם זה נכון לי, והאם זה נכון גם לאנשים סביבי?":"לפני החלטה אחת היום, שאלי: האם זה נכון לי, והאם זה נכון גם לאנשים סביבי?","בחר דבר אחד שאתה מתמיד בו, ונסח לעצמך במשפט אחד למה הוא יקר לך.":"בחרי דבר אחד שאת מתמידה בו, ונסחי לעצמך במשפט אחד למה הוא יקר לך.","כתוב את שלושת הדברים החשובים להיום, ומחק מהרשימה דבר אחד שיכול לחכות.":"כתבי את שלושת הדברים החשובים להיום, ומחקי מהרשימה דבר אחד שיכול לחכות.","בחר משימה גדולה שמכבידה עליך, ועשה בה היום צעד אחד, בלי לחשוב על הסוף.":"בחרי משימה גדולה שמכבידה עליך, ועשי בה היום צעד אחד, בלי לחשוב על הסוף.","חזור היום למשהו שהתחלת ועזבת, ועשה בו עוד צעד אחד, קטן ככל שיהיה.":"חזרי היום למשהו שהתחלת ועזבת, ועשי בו עוד צעד אחד, קטן ככל שיהיה.","הלל אומר: ״ולא הבישן למד״. מי שמתבייש לשאול, נשאר במקום. התמדה אמיתית יודעת גם להודות: ״אני צריך כאן עזרה״. הענווה הזו לא עוצרת את הדרך, היא מקצרת אותה.":"הלל אומר: ״ולא הבישן למד״. מי שמתבייש לשאול, נשאר במקום. התמדה אמיתית יודעת גם להודות: ״אני צריכה כאן עזרה״. הענווה הזו לא עוצרת את הדרך, היא מקצרת אותה.","שאל היום שאלה אחת שהתביישת לשאול, את מי שיכול לעזור לך.":"שאלי היום שאלה אחת שהתביישת לשאול, את מי שיכול לעזור לך.","התקשר היום לחבר שלא דיברתם מזמן, רק כדי לשאול מה שלומו.":"התקשרי היום לחבר שלא דיברתם מזמן, רק כדי לשאול מה שלומו.","הלל אומר: ״ואל תאמר לכשאפנה אשנה, שמא לא תפנה״. הזמן הפנוי לא באמת מגיע. מלכות שבנצח היא להפוך כוונה למעשה עכשיו, במקום שבו אתה נמצא, עם הזמן שיש.":"הלל אומר: ״ואל תאמר לכשאפנה אשנה, שמא לא תפנה״. הזמן הפנוי לא באמת מגיע. מלכות שבנצח היא להפוך כוונה למעשה עכשיו, במקום שבו את נמצאת, עם הזמן שיש.","בחר דבר אחד שאתה דוחה ״לכשיהיה זמן״, וקבע לו היום מועד ביומן.":"בחרי דבר אחד שאת דוחה ״לכשיהיה זמן״, וקבעי לו היום מועד ביומן.","כשמישהו מרגיז אותך היום, חשוב על שתי סיבות טובות אפשריות למה שעשה.":"כשמישהו מרגיז אותך היום, חשבי על שתי סיבות טובות אפשריות למה שעשה.","כשאתה שומע היום את עצמך מקטין את מה שעשית, עצור ואמור פשוט: עשיתי את זה.":"כשאת שומעת היום את עצמך מקטינה את מה שעשית, עצרי ואמרי פשוט: עשיתי את זה.","כתוב היום שלושה דברים שיש לך, ושהיית מתגעגע אליהם אילו חסרו.":"כתבי היום שלושה דברים שיש לך, ושהיית מתגעגעת אליהם אילו חסרו.","קבע לך רגע קבוע, למשל לפני השינה, ואמור בו תודה אחת על משהו מהיום.":"קבעי לך רגע קבוע, למשל לפני השינה, ואמרי בו תודה אחת על משהו מהיום.","בחר מישהו שאתה רגיל לקבל כמובן מאליו, ואמור לו היום מה אתה מעריך בו.":"בחרי מישהו שאת רגילה לקבל כמובן מאליו, ואמרי לו היום מה את מעריכה בו.","בן זומא שואל: ״איזהו חכם, הלומד מכל אדם״. מי שמוכן ללמוד מכל אחד, מתחבר לכל אחד. גם מי שצעיר ממך, שונה ממך, או לא מסכים איתך, יודע משהו שאתה עוד לא יודע.":"בן זומא שואל: ״איזהו חכם, הלומד מכל אדם״. מי שמוכן ללמוד מכל אחד, מתחבר לכל אחד. גם מי שצעיר ממך, שונה ממך, או לא מסכים איתך, יודע משהו שאת עוד לא יודעת.","שאל היום מישהו שונה ממך שאלה אחת, רק כדי ללמוד ממנו.":"שאלי היום מישהו שונה ממך שאלה אחת, רק כדי ללמוד ממנו.","חשוב על אנשים שלידם אתה גדל, ומצא היום דרך להיות במחיצתם עוד קצת.":"חשבי על אנשים שלידם את גדלה, ומצאי היום דרך להיות במחיצתם עוד קצת.","היה היום הראשון לומר שלום: לשכן, לנהג, לקופאית. ושים לב מה זה עושה.":"היי היום הראשונה לומר שלום: לשכן, לנהג, לקופאית. ושימי לב מה זה עושה.","תן היום לאדם קרוב את המרחב שהוא צריך, בלי לפרש את זה כריחוק.":"תני היום לאדם קרוב את המרחב שהוא צריך, בלי לפרש את זה כריחוק.","חשוב היום על אדם שרחוק ממך בדעות או באורח חיים, ומצא בו דבר אחד שאפשר לאהוב.":"חשבי היום על אדם שרחוק ממך בדעות או באורח חיים, ומצאי בו דבר אחד שאפשר לאהוב.","חשוב על מישהו שעובר תקופה קשה, ומצא היום דרך קטנה להראות לו שאתה שם.":"חשבי על מישהו שעובר תקופה קשה, ומצאי היום דרך קטנה להראות לו שאת שם.","רבי אליעזר אומר: ״יהי כבוד חברך חביב עליך כשלך״. בקשר קרוב קל לשכוח להעריך. הוד שביסוד הוא לשמור על הכבוד של מי שקרוב, בדיוק כמו שהיית שומר על הכבוד שלך.":"רבי אליעזר אומר: ״יהי כבוד חברך חביב עליך כשלך״. בקשר קרוב קל לשכוח להעריך. הוד שביסוד הוא לשמור על הכבוד של מי שקרוב, בדיוק כמו שהיית שומרת על הכבוד שלך.","הודה היום לאדם קרוב על משהו שהוא עושה כל הזמן, ושאף אחד כבר לא שם לב אליו.":"הודי היום לאדם קרוב על משהו שהוא עושה כל הזמן, ושאף אחד כבר לא שם לב אליו.","השתתף היום במשהו משותף, קבוצה, מפגש או התנדבות, גם אם רק לזמן קצר.":"השתתפי היום במשהו משותף, קבוצה, מפגש או התנדבות, גם אם רק לזמן קצר.","שים לב היום איך אנשים מרגישים לידך, ועשה דבר אחד שיקל עליהם.":"שימי לב היום איך אנשים מרגישים לידך, ועשי דבר אחד שיקל עליהם.","רבי ישמעאל אומר: ״והוי מקבל את כל האדם בשמחה״. מלכות היא הנוכחות שלך בעולם. כשיש בה חסד, אנשים מרגישים רצויים ברגע שהם נכנסים לחדר שבו אתה נמצא, עוד לפני שאמרת מילה.":"רבי ישמעאל אומר: ״והוי מקבל את כל האדם בשמחה״. מלכות היא הנוכחות שלך בעולם. כשיש בה חסד, אנשים מרגישים רצויים ברגע שהם נכנסים לחדר שבו את נמצאת, עוד לפני שאמרת מילה.","קבל היום כל מי שפונה אליך במבט ישיר ובחיוך, גם כשאתה עסוק.":"קבלי היום כל מי שפונה אליך במבט ישיר ובחיוך, גם כשאת עסוקה.","עשה היום משהו שהבטחת, לפני שמזכירים לך, ובלי להודיע שעשית.":"עשי היום משהו שהבטחת, לפני שמזכירים לך, ובלי להודיע שעשית.","תן היום כבוד גלוי למישהו שבדרך כלל לא מקבל אותו: עובד ניקיון, שליח, ילד.":"תני היום כבוד גלוי למישהו שבדרך כלל לא מקבל אותו: עובד ניקיון, שליח, ילד.","שאל את עצמך: על מה הייתי רוצה שיזכרו אותי? ועשה היום מעשה אחד בכיוון הזה.":"שאלי את עצמך: על מה הייתי רוצה שיזכרו אותי? ועשי היום מעשה אחד בכיוון הזה.","תן היום תשומת לב מלאה למישהו שבדרך כלל אתה מדלג עליו.":"תני היום תשומת לב מלאה למישהו שבדרך כלל את מדלגת עליו.","במפגש אחד היום, שים בצד את מה שאתה רוצה להשיג, ופשוט היה שם בלב טוב.":"במפגש אחד היום, שימי בצד את מה שאת רוצה להשיג, ופשוט היי שם בלב טוב.","התורה מתארת ״שבע שבתות תמימת״, שבעה שבועות שלמים, ולמחרתם חג השבועות. מלכות שבמלכות היא הנוכחות המלאה: כל מה שעבדת עליו בשבעה שבועות מתבטא עכשיו במי שאתה.":"התורה מתארת ״שבע שבתות תמימת״, שבעה שבועות שלמים, ולמחרתם חג השבועות. מלכות שבמלכות היא הנוכחות המלאה: כל מה שעבדת עליו בשבעה שבועות מתבטא עכשיו במי שאת.","הסתכל אחורה על 49 הימים, ובחר מידה אחת שאתה לוקח איתך הלאה.":"הסתכלי אחורה על 49 הימים, ובחרי מידה אחת שאת לוקחת איתך הלאה.","בחר רעיון טוב אחד שאתה רק מדבר עליו, ותן לו היום שורש: מעשה קטן אחד.":"בחרי רעיון טוב אחד שאת רק מדברת עליו, ותני לו היום שורש: מעשה קטן אחד.","בחר דבר אחד שהעיק עליך השנה, ושאל: מה הוא לימד אותי, או לאן הוא הוביל?":"בחרי דבר אחד שהעיק עליך השנה, ושאלי: מה הוא לימד אותי, או לאן הוא הוביל?","ספר הערב, בסדר או לעצמך, סיפור קטן מחייך: מקום צר שהיית בו, איך יצאת ממנו, ומה למדת.":"ספרי הערב, בסדר או לעצמך, סיפור קטן מחייך: מקום צר שהיית בו, איך יצאת ממנו, ומה למדת.","בחר הרגל טוב אחד מתוך 49 הימים, והתחל אותו היום, עוד לפני שאתה בטוח שהוא מתאים לך.":"בחרי הרגל טוב אחד מתוך 49 הימים, והתחילי אותו היום, עוד לפני שאת בטוחה שהוא מתאים לך."};
/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function realNow(){ return new Date(); }
let demoOffset = 0; // days, for previewing other weekdays
function now(){ const d = realNow(); d.setDate(d.getDate()+demoOffset); return d; }
/* Hebrew numerals: 14 -> י״ד, 5787 -> תשפ״ז */
function gematria(n){
  n = n % 1000; let s = "";
  const H = ["","ק","ר","ש","ת"], T = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"], U = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
  while(n >= 400){ s += "ת"; n -= 400; }
  if(n >= 100){ s += H[Math.floor(n/100)]; n %= 100; }
  if(n === 15){ s += "טו"; n = 0; } else if(n === 16){ s += "טז"; n = 0; }
  if(n >= 10){ s += T[Math.floor(n/10)]; n %= 10; }
  s += U[n];
  return s.length === 1 ? s + "׳" : s.slice(0,-1) + "״" + s.slice(-1);
}
function hebDate(d){
  try{
    const parts = new Intl.DateTimeFormat("he-u-ca-hebrew-nu-latn",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d);
    const get = k => (parts.find(x => x.type===k)||{}).value || "";
    const day = parseInt(get("day"),10), year = parseInt(get("year"),10), month = get("month");
    if(!day || !year || !month) throw 0;
    return `${gematria(day)} ב${month.replace(/^ב/,"")} ${gematria(year)}`;
  }catch(e){ try{ return new Intl.DateTimeFormat("he-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).format(d); }catch(e2){ return ""; } }
}

function hebMonth(d){ try{ return new Intl.DateTimeFormat("he-u-ca-hebrew",{month:"long"}).format(d); }catch(e){ return ""; } }
function monthTheme(d){

function hebParts(d){ try{ const ps = new Intl.DateTimeFormat("he-u-ca-hebrew-nu-latn",{day:"numeric",month:"long"}).formatToParts(d);
  return {day: parseInt((ps.find(x=>x.type==="day")||{}).value,10), month: (ps.find(x=>x.type==="month")||{}).value||""}; }catch(e){ return {day:0, month:""}; } }
/* 1..8 during Hanukkah (day 1 = 25 Kislev), else 0 */
function chanukahDay(d){ for(let i=0;i<8;i++){ const x = new Date(d); x.setDate(x.getDate()-i); const h = hebParts(x); if(h.day===25 && h.month.includes("כסלו")) return i+1; } return 0; }
function candles(n){
  /* eight candles and the shamash in the middle; the first candle is on the right */
  const slots = [270,240,210,180,120,90,60,30];
  let s = `<svg class="candles" viewBox="0 0 300 112" width="100%" role="img" aria-label="חנוכה: ${n} נרות דולקים"><line class="base" x1="12" y1="98" x2="288" y2="98"/>`;
  const one = (x, top, lit) => `<rect class="wax" x="${x-4}" y="${top}" width="8" height="${98-top}" rx="2"/>` + (lit ? `<path class="fl" d="M${x} ${top-22} C${x+6} ${top-13} ${x+7} ${top-7} ${x} ${top-3} C${x-7} ${top-7} ${x-6} ${top-13} ${x} ${top-22} Z"/>` : "");
  s += one(150, 44, n>0);
  slots.forEach((x,i) => { s += one(x, 62, i < n); });
  return s + `</svg>`;
}
/* Yom Tov (Israel): like Shabbat, a day of rest in the app: no tasks, no writing, no reminders. */
function yomTov(d){ const h = hebParts(d), m = h.month;
  if(m.includes("תשרי")) return ({1:"ראש השנה",2:"ראש השנה",10:"יום כיפור",15:"סוכות",22:"שמיני עצרת ושמחת תורה"})[h.day] || null;
  if(m.includes("ניסן")) return ({15:"פסח",21:"שביעי של פסח"})[h.day] || null;
  if(m.includes("סיו") && h.day===6) return "שבועות";
  return null; }
const restDay = d => d.getDay()===6 || !!yomTov(d);
/* Which holiday falls on this day, if any (key of HOLIDAYS). */
function holidayOf(d){ const h = hebParts(d), m = h.month;
  if(h.day===15 && m.includes("שבט")) return "tubishvat";
  if(h.day===14 && m.includes("אדר") && !m.includes("א׳")) return "purim";
  if(h.day===15 && m.includes("ניסן")) return "pesach";
  if(h.day===6 && m.includes("סיו")) return "shavuot";
  return null; }
/* 1..49 during the Omer (day 1 = 16 Nisan), else 0 */
function omerDay(d){ for(let i=0;i<49;i++){ const x = new Date(d); x.setDate(x.getDate()-i); const h = hebParts(x); if(h.day===16 && h.month.includes("ניסן")) return i+1; } return 0; }
function monthKey(d){ const m = hebMonth(d); for(const [k] of MONTHS){ if(k==="אב" ? (m.trim()==="אב" || m.trim()==="מנחם אב") : m.includes(k)) return k==="חשו"?"חשון":k==="סיו"?"סיון":k; } return null; }
function weekNum(d){ const a = new Date(d.getFullYear(),0,1); return Math.floor((d - a)/(7*864e5)); }
function weekStart(d){ const s = new Date(d); s.setHours(0,0,0,0); s.setDate(s.getDate()-s.getDay()); return s; }

/* ---------- storage: private per-viewer db, falling back to this device ---------- */
const store = { mode:"memory", db:null, uid:null, mem:{profile:null, days:{}} };
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function withTimeout(p, ms){ return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
async function initStore(){
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const [db, user] = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 6000) || [];
      const uid = user ? await withTimeout(user.id(), 3000) : null;
      /* A viewer who may not write (a Viewer, or anyone from outside the organization) keeps their data on this device. */
      let canWrite = null;
      try{ canWrite = user ? await withTimeout(user.can("data.write"), 3000) : null; }catch(e){ canWrite = null; }
      if(db && uid && canWrite !== false){ store.db = db; store.uid = uid; store.user = user; store.mode = "cloud"; return; }
      if(user) store.user = user;
    }
  }catch(e){}
  try{ localStorage.setItem("mh-probe","1"); localStorage.removeItem("mh-probe"); store.mode = "local"; }catch(e){ store.mode = "memory"; }
}
const profRef = () => store.db.doc("data/users/"+store.uid+"/profile");
const daysCol = () => profRef().collection("days");
async function fallback(){ store.mode = "local"; try{ localStorage.setItem("mh-probe","1"); }catch(e){ store.mode = "memory"; } }
async function loadProfile(){
  if(store.mode==="cloud"){
    try{ const s = await profRef().get(); if(s.exists) return {...s.data()}; }catch(e){}
    /* nothing in the account: if an earlier visit had to save on this device, carry on from there */
    if(lsGet("mh-profile")){ await fallback(); return lsGet("mh-profile"); }
    return null;
  }
  if(store.mode==="local") return lsGet("mh-profile");
  return store.mem.profile;
}
async function saveProfile(p){
  if(store.mode==="cloud"){ try{ await profRef().set(p); return; }catch(e){ await fallback(); } }
  if(store.mode==="local"){ lsSet("mh-profile", p); return; }
  store.mem.profile = p;
}
async function loadDays(){
  if(store.mode==="cloud"){
    try{ const snap = await daysCol().orderBy("date","desc").limit(400).get(); const out = {}; snap.docs.forEach(d => { out[d.id] = JSON.parse(JSON.stringify(d.data())); }); return out; }
    catch(e){ await fallback(); }
  }
  if(store.mode==="local") return lsGet("mh-days") || {};
  return store.mem.days;
}
async function saveDay(key, day){
  if(store.mode==="cloud"){ try{ await daysCol().doc(key).set(day); return; }catch(e){ await fallback(); } }
  if(store.mode==="local"){ const all = lsGet("mh-days") || {}; all[key] = day; lsSet("mh-days", all); return; }
  store.mem.days[key] = day;
}

/* ---------- guiding: a weekly summary the person chooses to share, and notes from their guide ----------
   shares/<id>              the summary (only guides, the artifact's Editors, can read it; each person writes only their own)
   shares/<id>/notes/<n>    a good word or a weekly question from a guide (the person reads their own) */
const DAY = 864e5;
async function syncShare(){
  if(store.mode!=="cloud" || S.demo || !S.profile) return;
  const ref = store.db.doc("shares/"+store.uid);
  try{
    if(!S.profile.shareWithGuide){ await ref.set({optIn:false, updatedAt:new Date().toISOString()}); return; }
    const w = weekStats(S.days, realNow()), L = level(), garments = {};
    CHANNELS.forEach(([c]) => garments[c] = {w:w.chW[c], a:w.chA[c]});
    await ref.set({optIn:true, level:L.i, activeDays:L.n, workDays:w.workDays, wins:w.wins, autos:w.autos, garments,
      weekStart:keyOf(weekStart(realNow())), updatedAt:new Date().toISOString()});
  }catch(e){}
}
async function loadNotes(){
  S.notes = []; S.names = {};
  if(store.mode!=="cloud") return;
  try{
    const snap = await store.db.collection("shares/"+store.uid+"/notes").orderBy("at","desc").limit(20).get();
    S.notes = snap.docs.map(d => ({id:d.id, ...d.data()}));
    await resolveNames(S.notes.map(n => n.by));
  }catch(e){ S.notes = []; }
}
async function resolveNames(ids){
  ids = [...new Set(ids.filter(Boolean))]; if(!ids.length || !store.user) return;
  try{ const ps = await store.user.profiles(ids); ids.forEach(i => { S.names[i] = (ps && ps[i] && ps[i].name) || ""; }); }catch(e){}
}
const recentNote = (kind, days) => (S.notes||[]).find(n => n.kind===kind && Date.now() - Date.parse(n.at) < days*DAY);
function guideWordCard(){
  const n = recentNote("word", 14); if(!n) return "";
  return `<div class="card"><p class="eyebrow">מילה טובה מהמלווה שלך</p><p class="q">${esc(n.text)}</p>${S.names[n.by]?`<p class="small muted">${esc(S.names[n.by])}</p>`:""}</div>`;
}

const ff = s => (isF() && FEM[s]) || s;
const G = (m, f) => isF() ? f : m;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){ const t = document.getElementById("toast"); t.innerHTML = `<span>${esc(msg)}</span>`; clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = "", 2600); }
function days(){ return S.demo || S.days; }
function today(){ const k = keyOf(now()); return days()[k] || {date:k, done:false, moments:[], debrief:null}; }
async function putToday(day){
  const k = keyOf(now()); day.date = k;
  if(S.demo){ S.demo[k] = day; return; }
  S.days[k] = day; await saveDay(k, day);
  if(S.profile){ const t = new Date().toISOString(); S.profile.lastActive = t; await saveProfile(S.profile); }

function activeDays(){ return Object.values(days()).filter(d => d.done || (d.moments||[]).length || d.debrief || d.morning || d.noon || d.guided).length; }
function level(){
  const n = activeDays(); let i = 0; LEVELS.forEach((l,j) => { if(n >= l.from) i = j; });
  const next = LEVELS[i+1]; const pct = next ? Math.round((n - LEVELS[i].from) / (next.from - LEVELS[i].from) * 100) : 100;
  return {i, n, next, pct};
}
function isDistress(texts){ const all = texts.join(" "); return DISTRESS.some(w => all.includes(w)); }

/* ---------- the score: SVG helpers ---------- */
function staffLines(x1, x2, ys){ return ys.map(y => `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`).join(""); }
function note(cls, x, y, rx, ry){ return `<ellipse class="${cls}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(-20 ${x} ${y})"/>`; }
/* The week as one staff: Sunday at the right. Pitch rises with the day's work; today is in the conductor's blue; Shabbat is a rest. */
function weekStaff(ref){
  const d = ref || now(), ws = weekStart(d), all = days(), tk = keyOf(now());
  let s = `<svg class="stf" viewBox="0 -8 300 92" width="100%" role="img" aria-label="השבוע כשורת תווים">` + staffLines(0, 300, [14,24,34,44,54]);
  for(let i=0;i<7;i++){
    const x = 276 - i*42, xd = new Date(ws); xd.setDate(ws.getDate()+i);
    const k = keyOf(xd), day = all[k] || {}, isT = k===tk, fut = !isT && xd > d;
    const act = (day.done?1:0) + (day.moments||[]).filter(m => m.result==="win").length + (day.debrief?1:0);
    if(i===6){ s += `<rect class="${isT?"n-pen":"n-ink"}" x="${x-7}" y="24" width="14" height="5"/>`; }
    else {
      const y = fut ? 44 : 49 - Math.min(act,4)*5, rx = isT?8.5:7, ry = isT?6:5;
      s += note((isT?"n-pen":(act?"n-ink":"n-hol")) + (fut?" fut":""), x, y, rx, ry);
      if(act || isT) s += `<line class="${isT?"stem-pen":"stem-ink"}" x1="${x+rx-1}" y1="${y-1}" x2="${x+rx-1}" y2="${y-30}"/>`;
    }
    s += `<text x="${x}" y="78" text-anchor="middle" class="${isT?"t-pen":""}">${DAY_SHORT[i]}</text>`;
  }
  return s + `</svg>`;
}
function restMark(){
  return `<svg class="stf" viewBox="0 0 90 44" width="110" style="margin:0 auto" aria-hidden="true">${staffLines(0,90,[4,12,20,28,36])}<rect class="n-pen" x="36" y="12" width="18" height="6"/></svg>`;
}

}
/* Three touch points a day, like the prayers: a morning intention, a midday stop, the evening reflection.
   Morning and midday show by the clock and are always optional; nothing counts what was missed. */
function morningCard(day, d){
  if(day.morning && day.morning.intent) return `<p class="intent">הכוונה להיום: <b>${esc(day.morning.intent)}</b></p>`;
  if(d.getHours() >= 12 || day.morning) return "";
  return `<div class="card center"><p class="eyebrow">רגע של בוקר</p><p>דקה אחת: שלוש נשימות וכוונה אחת ליום.</p>
    <div><button class="btn ghost" data-act="pause" data-k="morning" type="button">להתחיל את היום</button></div></div>`;
}
function noonCard(day, d){
  const h = d.getHours(); if(h < 12 || h >= 17) return "";
  if(day.noon) return `<p class="intent">עצרת בצהריים ✓</p>`;
  return `<div class="card center"><p class="eyebrow">עצירה של צהריים</p><p class="muted">חצי דקה: איפה אני עכשיו?</p>
    <div><button class="btn ghost" data-act="pause" data-k="noon" type="button">לעצור לרגע</button></div></div>`;
}
function guidedCard(day, d){
  const g = GUIDED[weekNum(d) % GUIDED.length];
  return `<div class="card"><p class="eyebrow">התבוננות מודרכת · פעם בשבוע</p><h2 style="font-size:1.6rem">${esc(ff(g.t))}</h2>
    <p class="muted">חמש דקות של דמיון מודרך, בקצב שלך. ${day.guided ? "✓ עשית את זה היום." : ""}</p>
    <div><button class="btn ghost" data-act="guided" type="button">${day.guided ? "שוב" : "להתחיל"}</button></div></div>`;
}
/* Sunday: open the week. Last week's melody, and one thing to take into this week. */
function weekOpeningCard(d, intent){
  if(intent) return `<p class="intent">השבוע: <b>${esc(intent)}</b></p>`;
  const last = new Date(d); last.setDate(last.getDate()-7);
  const w = weekStats(days(), last), had = w.wins || w.autos || w.done;
  return `<div class="card accent"><p class="eyebrow">פתיחת שבוע</p>
    ${had ? `<span class="label">המנגינה של השבוע שעבר</span>${weekStaff(last)}<p class="small muted">${w.wins} ניצחונות, ${w.autos} רגעי אוטומט, ${w.done} מעשים. ראית, למדת, ממשיכים.</p>` : `<p class="small muted">שבוע חדש מתחיל.</p>`}
    <label class="q" for="wk-intent">מה לוקחים לשבוע הזה?</label>
    <input id="wk-intent" type="text" placeholder="משפט אחד">
    <div><button class="btn" data-act="save-intent" type="button">לשמור לשבוע</button></div></div>`;
}

  grid.forEach((col,i) => {

    if(i===6){ s += `<rect class="n-ink" x="${x-6}" y="${ys[2]-6}" width="12" height="5"/>`; }
    else ARENAS.forEach(([k],j) => { const c = col.arenas[k]; const y = ys[j];

function weekStats(all, d){
  const ws = weekStart(d), week = []; for(let i=0;i<7;i++){ const x = new Date(ws); x.setDate(ws.getDate()+i); week.push(x); }

  CHANNELS.forEach(([k]) => { chW[k] = 0; chA[k] = 0; });
  const grid = week.map(x => { const col = {key:keyOf(x), arenas:{}}; ARENAS.forEach(([k]) => col.arenas[k] = {win:0, auto:0}); return col; });
  const addWin = (A, arena, ch) => { wins++; if(arena){ A[arena].win++; winArenas.add(arena); } if(ch) chW[ch]++; };
  const addAuto = (A, arena, ch) => { autos++; if(arena) A[arena].auto++; if(ch) chA[ch]++; };
  week.forEach((x,i) => { const day = all[keyOf(x)]; if(!day) return; const A = grid[i].arenas; if(day.done) done++;
    if(day.done || (day.moments||[]).length || day.debrief) workDays++;
    (day.moments||[]).forEach(m => m.result==="win" ? addWin(A, m.arena, m.channel) : addAuto(A, m.arena, m.channel));
    const b = day.debrief; if(!b) return;
    if(b.g){ CHANNELS.forEach(([c]) => { const o = b.g[c]; if(!o || !o.result) return; o.result==="win" ? addWin(A, o.arena, c) : addAuto(A, o.arena, c); }); }

function makeDemo(){
  const out = {}, d = now(), ws = weekStart(d), ar = ARENAS.map(a=>a[0]), ch = CHANNELS.map(c=>c[0]);
  let seed = 7; const rnd = n => { seed = (seed*9301+49297)%233280; return Math.floor(seed/233280*n); };
  for(let i=0;i<=Math.min(5, d.getDay()===6?5:d.getDay());i++){
    const x = new Date(ws); x.setDate(ws.getDate()+i); const k = keyOf(x);
    const moments = []; for(let j=0;j<2+rnd(3);j++) moments.push({result: rnd(3)?"win":"auto", arena: ar[rnd(5)], channel: ch[rnd(3)]});
    const sample = {thought:"תפסתי את עצמי מתעסק בטינה, ועברתי לדבר אחר", speech:"עצרתי לפני שעניתי בחוסר סבלנות", action:"סידרתי משהו שדחיתי שבוע"};
    const g = {}; ch.forEach(c => { g[c] = rnd(3) ? {text: sample[c], result: rnd(3)?"win":"auto", arena: ar[rnd(5)]} : {text:"", result:null, arena:null}; });
    out[k] = {date:k, done: rnd(4)>0, moments, debrief: rnd(3)?{lvl:1, g, tomorrow:"נשימה אחת לפני שאני עונה"}:null};
  }
  for(let i=1;i<=40;i++){ const x = new Date(ws); x.setDate(ws.getDate()-i); if(x.getDay()===6) continue; const k = keyOf(x); out[k] = {date:k, done:true, moments:[], debrief:null}; }
  return out;
}

  else if(a==="gd-back"){ GD.step = Math.max(0, GD.step-1); drawGuided(); }
  else if(a==="gd-done"){ const day = today(); day.guided = true; await putToday(day); closeOv(); render(); toast("ראית, למדת, ממשיכים."); }
  else if(a==="close-day"){ closeOv(); S.tab = "today"; render(); window.scrollTo(0,0); }
  else if(a==="closing-map"){ closeOv(); S.tab = "map"; render(); window.scrollTo(0,0); }
  else if(a==="edit-debrief"){ const b = today().debrief; D = b.g ? JSON.parse(JSON.stringify(b)) : {...blankDraft(), tomorrow: b.tomorrow||""}; render(); }
  else if(a==="moment"){ openMoment(); }
  else if(a==="m-next"){ clearTimeout(breathT); M.step++; drawMoment(); }
  else if(a==="m-save"){ const day = today(); day.moments = [...(day.moments||[]), {result:M.result, arena:M.arena, channel:M.channel, at:new Date().toISOString()}]; await putToday(day); M.step = 3; drawMoment(); render(); }
  else if(a==="close"){ M = null; closeOv(); }
  else if(a==="help"){ openHelp(""); }
  else if(a==="settings"){ openSettings(); }
  else if(a==="pick-day"){ const want = Number(t.dataset.d), cur = realNow().getDay(); demoOffset = want - cur; closeOv(); render(); }
  else if(a==="real-day"){ demoOffset = 0; render(); }
  else if(a==="preview-level"){ openLevelUp(Number(t.dataset.i), true); }
  else if(a==="edit-mission"){ ov.innerHTML = `<div class="overlay"><div class="ov-in"><button class="close" data-act="close" type="button">סגירה</button>${missionCard(false)}</div></div>`; }
  else if(a==="toggle-share"){ S.profile.shareWithGuide = !S.profile.shareWithGuide; await saveProfile(S.profile); await syncShare(); openSettings(); toast(S.profile.shareWithGuide ? "הסיכום השבועי משותף עם המלווה." : "השיתוף הופסק."); }
  else if(a==="guide"){ openGuide(); }
  else if(a==="guide-send"){ const i = Number(t.dataset.i), p = (S.guidePeople||[])[i], ta = document.getElementById("gt-"+i), text = ((ta && ta.value) || "").trim();
    if(!p) return; if(!text){ toast(G("כתוב קודם משפט קצר.","כתבי קודם משפט קצר.")); return; }
    try{ await store.db.collection("shares/"+p.id+"/notes").doc("n"+Date.now()).set({kind:t.dataset.k, text, at:new Date().toISOString(), by:store.uid}); toast("נשלח."); openGuide(); }
    catch(e){ toast(G("השליחה לא הצליחה. נסה שוב.","השליחה לא הצליחה. נסי שוב.")); } }
  else if(a==="save-mission"){ const v = (document.getElementById("mission").value || "").trim(); S.profile.mission = v; await saveProfile(S.profile); closeOv(); render(); toast(v ? "השליחות נשמרה." : "השליחות נמחקה."); }
  else if(a==="preview-chanukah"){ for(let i=0;i<400;i++){ const x = realNow(); x.setDate(x.getDate()+i); if(chanukahDay(x)===3 && x.getDay()!==6){ demoOffset = i; break; } } closeOv(); S.tab = "today"; render(); }
  else if(a==="preview-omer" || a==="preview-purim"){ for(let i=0;i<420;i++){ const x = realNow(); x.setDate(x.getDate()+i); if(x.getDay()===6) continue; if(a==="preview-omer" ? omerDay(x)===2 : holidayOf(x)==="purim"){ demoOffset = i; break; } } closeOv(); S.tab = "today"; render(); }
  else if(a==="listen"){ toggleListen(); }
  else if(a==="save-idea"){ const it = S.todayItem; if(!it) return; const list = S.profile.saved || [];
    if(isSaved(it)){ S.profile.saved = list.filter(x => x.id !== ideaId(it)); toast("הוסר מהמחברת."); }
    else { S.profile.saved = [...list, {id: ideaId(it), t: it.t, x: it.x, s: it.s, at: new Date().toISOString()}]; toast("נשמר במחברת. היא במפה."); }
    await saveProfile(S.profile); render(); }
  else if(a==="unsave-idea"){ S.profile.saved = (S.profile.saved||[]).filter(x => x.id !== t.dataset.id); await saveProfile(S.profile); render(); }
  else if(a==="share-month"){ const {m} = monthDays(now()); const text = `המנגינה שלי בחודש ${m}: עבודה פנימית, יום אחרי יום. מנגינת החיים`;
    try{ if(navigator.share){ await navigator.share({text}); } else { await navigator.clipboard.writeText(text); toast("הועתק. אפשר להדביק ולשלוח."); } }catch(e){} }
  else if(a==="rem-google" || a==="rem-ics"){ const tm = reminderTime(); S.profile.reminder = tm; await saveProfile(S.profile);
    const st = reminderStart(tm), en = new Date(st.getTime() + 5*60000), title = "מנגינת החיים · רגע של חיבור?", url = (window.claude && window.claude.use) ? "https://claude.ai/artifact/WiXonev3tnCN4cGSYBRjSz" : APP_URL;
    const rule = "RRULE:FREQ=WEEKLY;BYDAY=SU,MO,TU,WE,TH,FR", skips = reminderSkips(st);
    if(a==="rem-google"){ const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Jerusalem";
      window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${icsStamp(st)}/${icsStamp(en)}&ctz=${encodeURIComponent(tz)}&recur=${encodeURIComponent(rule + (skips.length ? "\nEXDATE:" + skips.join(",") : ""))}&details=${encodeURIComponent("דקה אחת: שלוש נשימות וכוונה אחת ליום. "+url)}`, "_blank", "noopener"); }
    else { const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Manginat HaChaim//HE","BEGIN:VEVENT","UID:mh-reminder-"+Date.now()+"@manginat","DTSTAMP:"+icsStamp(new Date()),"DTSTART:"+icsStamp(st),"DTEND:"+icsStamp(en),rule,...(skips.length ? ["EXDATE:"+skips.join(",")] : []),"SUMMARY:"+title,"DESCRIPTION:דקה אחת: שלוש נשימות וכוונה אחת ליום. "+url,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+title,"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
      const aEl = document.createElement("a"); aEl.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"})); aEl.download = "manginat-reminder.ics"; document.body.appendChild(aEl); aEl.click(); aEl.remove(); }
    toast("השעה נשמרה. עכשיו מאשרים ביומן."); }
  else if(a==="set-voice" || a==="set-rate"){ const v = {...voicePref()}; if(a==="set-voice") v.voice = t.dataset.k; else v.rate = Number(t.dataset.k); if(S.speaking){ S.speaking = false; stopAudio(); }
    S.profile.voice = v; await saveProfile(S.profile); openSettings(); }
  else if(a==="voice-sample"){ playFile("sample", () => {}); }
  else if(a==="save-intent"){ const v = ((document.getElementById("wk-intent")||{}).value || "").trim(); if(!v){ toast(G("כתוב קודם משפט אחד.","כתבי קודם משפט אחד.")); return; }
    S.profile.intents = {...(S.profile.intents||{}), [keyOf(weekStart(now()))]: v}; await saveProfile(S.profile); render(); toast("נשמר לשבוע הזה."); }
  else if(a==="demo-on"){ S.demo = makeDemo(); closeOv(); S.tab = "map"; render(); }
  else if(a==="demo-off"){ S.demo = null; closeOv(); render(); }
  else if(a==="redo-quiz"){ closeOv(); S.ob = {step:3, quiz:[], agreed:true, gender: S.profile.gender, prev: S.profile}; S.profile = null; render(); }
});

/* ---------- boot ---------- */
(async function boot(){
  await initStore();
  S.profile = await loadProfile();
  S.days = await loadDays() || {};
  await loadNotes();
  if(store.user){ try{ S.isGuide = await store.user.canEdit(); }catch(e){ S.isGuide = false; } }
  /* Listening plays the pre-made recordings in audio/ (see AUDIO_MAP). */
  try{ await hashItems(); }catch(e){}
  S.canSpeak = typeof Audio === "function";
  if(S.profile && S.profile.lastActive){ const gap = (Date.now() - Date.parse(S.profile.lastActive)) / 864e5; S.welcomeBack = gap > 3; }
  render();
})();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
